t="400" text-anchor="start" fill="#111" >S1 para 137</text><text x="22" y="475" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >SIF-3</text><text x="82" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Flammable release</text><text x="232" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >gas / flame / manual -&gt; ESD-1 (matrix)</text><text x="512" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Pool and flash fire at the tank farm, sieve area or</text><text x="512" y="488" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >pumps. Demand: leaks from seals and flanges (IOGP 434-01</text><text x="512" y="501" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >hole-size frequencies, S15)</text><text x="842" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >detection with alarm, bund, ignition-source control (area</text><text x="842" y="488" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >classification not done), fire water and foam (gap)</text><text x="1182" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >SIL 2 (A)</text><text x="1272" y="475" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S5; S4 (detect); S10 (credit only</text><text x="1272" y="488" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >what is independent)</text><rect x="20" y="506" width="1465" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="516" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >SIF-4</text><text x="82" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Fermenter foam-over</text><text x="232" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >LSHH-201 -&gt; close XV-201</text><text x="512" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Foam to the vent, loss of CO2 scrubbing, overpressure.</text><text x="512" y="529" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Demand: antifoam failure</text><text x="842" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >LSH-201 alarm, AF-201 dosing, PVRV-201</text><text x="1182" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1272" y="516" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="22" y="544" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >SIF-5</text><text x="82" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Column overpressure</text><text x="232" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >PAHH-301 / 302 -&gt; close XV-301A / B</text><text x="512" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Overpressure of C-101 or C-102, release of hot ethanol</text><text x="512" y="557" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >vapour. Demand: steam valve or cooling failure</text><text x="842" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >TIC-302 / 303 control, PSV-301 / 302 (credited only for the</text><text x="842" y="557" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >residual)</text><text x="1182" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1272" y="544" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S2 para 32-34; S10</text><rect x="20" y="562" width="1465" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="572" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >SIF-6</text><text x="82" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Dryer fire</text><text x="232" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >TAHH-501 / SD-501 -&gt; close XV-501, stop feed,</text><text x="232" y="585" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >start DL-501</text><text x="512" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Smouldering or dust fire in the dryer. Demand: hot spot</text><text x="512" y="585" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >in DDGS</text><text x="842" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >TIC-501 control, housekeeping, explosion vents (do not</text><text x="842" y="585" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >prevent fire)</text><text x="1182" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1272" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A; dust data gap</text><rect x="20" y="394" width="1465" height="196" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><polyline points="80,394 80,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="230,394 230,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="510,394 510,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="840,394 840,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1180,394 1180,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1270,394 1270,590" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="598" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• No SIL verification is claimed: IEC 61511 and a LOPA text were not obtained (S19 snippets only), so the targets are labelled A. HSG238 (S2) supports separating protection from control and deriving</text><text x="34" y="611" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >integrity from a risk analysis; BP-Husky (S10) shows credited safeguards must be independent and tested. Proof-test intervals, architecture and PFDavg are not set.</text><rect x="8" y="8" width="1584" height="1114" rx="0" fill="none" stroke="#111" stroke-width="2.2"/><rect x="8" y="8" width="1584" height="66" rx="0" fill="#0d1b3e" stroke="none" stroke-width="1.2"/><text x="24" y="38" font-size="13" font-weight="700" text-anchor="start" fill="#9fb4ff" >VertiStrat Solutions LLP</text><text x="24" y="62" font-size="21" font-weight="700" text-anchor="start" fill="#fff" >Safety design basis 3: ESD cause-and-effect matrix and SIF list</text><text x="1576" y="38" font-size="13" font-weight="400" text-anchor="end" fill="#fff" >Sheet 7 of 9  |  Drawing VS-ETH-007  |  Rev B</text><text x="1576" y="62" font-size="13" font-weight="700" text-anchor="end" fill="#ffcc80" >CONCEPTUAL P&amp;ID - SCREENING BASIS - NOT FOR CONSTRUCTION</text><rect x="1135" y="960" width="445" height="140" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1143" y="981" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Project</text><text x="1205" y="981" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Grain ethanol (1G) distillery, 100 KLPD</text><polyline points="1135,992 1580,992" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1006" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Sheet</text><text x="1205" y="1006" font-size="11" font-weight="400" text-anchor="start" fill="#111" >7 of 9: ESD matrix, SIFs (SIL assumed, not verified)</text><polyline points="1135,1017 1580,1017" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1031" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Basis</text><text x="1205" y="1031" font-size="11" font-weight="400" text-anchor="start" fill="#111" >DPR template 100 KLPD + stoichiometry, 11 Nov 2026</text><polyline points="1135,1042 1580,1042" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1056" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Prepared</text><text x="1205" y="1056" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Claude Sonnet 5.5 for owner review, 11 Nov 2026</text><polyline points="1135,1067 1580,1067" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1081" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Status</text><text x="1205" y="1081" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Draft B. Screening aid, not certified design</text></svg></section><section class="sheet" id="s8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

</defs><rect width="1600" height="1130" fill="#fff"/><rect x="20" y="90" width="1100" height="15" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="22" y="100" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Topic</text><text x="172" y="100" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Basis for this plant</text><text x="772" y="100" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Status</text><text x="972" y="100" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Source</text><text x="22" y="115" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Gas detection (ethanol)</text><text x="172" y="115" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Ethanol vapour is 1.59 times air density (D, M/28.96): detectors at low level at pump seals (P-102,</text><text x="172" y="128" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >P-103), sieve manifold, tank bund sump and column bases. Voting 2oo4 to ESD-1 (A). Tags GD-301, GD-302,</text><text x="172" y="141" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >GD-401, GD-402.</text><text x="772" y="115" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A; detector type and alarm levels:</text><text x="772" y="128" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >gap (IEC 60079-29, OISD)</text><text x="972" y="115" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S4 and S8 give the</text><text x="972" y="128" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >principle for gas</text><text x="972" y="141" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >detection (hydrogen /</text><text x="972" y="154" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >fertilizer guidance)</text><rect x="20" y="159" width="1100" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="169" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Gas detection (CO2)</text><text x="172" y="169" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >CO2 is 1.52 times air density (D): GD-201 at floor level in the fermenter hall and pits, alarm and</text><text x="172" y="182" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >ventilation, entry control. CO2 rate 3,132 kg/h (D).</text><text x="772" y="169" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A; toxic and asphyxiant limits:</text><text x="772" y="182" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >gap, not obtained</text><text x="972" y="169" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="22" y="197" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Flame detection</text><text x="172" y="197" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >FD-401 line of sight over T-101, T-201A/B and the pump area. Ethanol flames are pale: detector type must</text><text x="172" y="210" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >suit alcohol (vendor).</text><text x="772" y="197" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="972" y="197" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S4: flames hard to see,</text><text x="972" y="210" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >leak detection to</text><text x="972" y="223" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >supplement (hydrogen)</text><rect x="20" y="228" width="1100" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="238" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Isolation of large</text><text x="22" y="251" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >inventories</text><text x="172" y="238" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >XV-402 (T-101 outlet), XV-401 (T-201A/B outlet), XV-404 (product inlet to T-101), XV-301A/B (reboiler</text><text x="172" y="251" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >steam): remotely operated, fail closed, power-independent action.</text><text x="772" y="238" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >R (drawn)</text><text x="972" y="238" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S1 para 128</text><text x="22" y="266" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Bund / dyke</text><text x="172" y="266" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >BD-401 around T-101 and T-201A/B: capacity not less than the larger of 110 % of the largest tank and 25 %</text><text x="172" y="279" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >of total tank capacity = 415 m3 (D from A tank sizes); drain valve DV-401 closed in service; rainwater</text><text x="172" y="292" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >allowance and fire-water holding: gap.</text><text x="772" y="266" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >R rule, A volumes</text><text x="972" y="266" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S1 para 157</text><rect x="20" y="297" width="1100" height="54" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="307" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Safety distances</text><text x="172" y="307" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >T-201A/B are above 250 m3 (A): HSG176 Table 1 distance for that band is 15 m to boundary, buildings and</text><text x="172" y="320" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >fixed ignition sources (R). T-101 (100 m3) falls in an intermediate band: read Table 1. Tank-to-tank</text><text x="172" y="333" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >spacing, columns, dryer and boiler distances: gap (NFPA 30, OISD-STD-118, not obtained). Domino</text><text x="172" y="346" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >escalation and occupied buildings must be addressed in layout.</text><text x="772" y="307" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >R for one band, gap for the rest</text><text x="972" y="307" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S1 Table 1; S3</text><text x="22" y="361" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Fire water and foam</text><text x="172" y="361" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >FW-401 cooling ring and monitors, FC-401 foam chamber on T-201A/B. Foam must suit a polar (water-</text><text x="172" y="374" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >miscible) liquid: alcohol-resistant type (A). Application density, duration and fire-water capacity: not</text><text x="172" y="387" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >set; process_safety/fire_water.py takes these as inputs.</text><text x="772" y="361" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A; gap: NFPA 11 / 15 / 30, OISD-</text><text x="772" y="374" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >STD-116 / 117 not obtained</text><text x="972" y="361" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="392" width="1100" height="41" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="402" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Ventilation and inerting</text><text x="172" y="402" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Fermenter hall natural or forced ventilation with low-level CO2 detection (A). Tank vapour spaces are not</text><text x="172" y="415" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >inerted (A); inerting of the sieve-bed regeneration loop is an option for the licensor. Dust areas:</text><text x="172" y="428" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >housekeeping and extraction at ML-101.</text><text x="772" y="402" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="972" y="402" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S12 (ventilation failures</text><text x="972" y="415" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >as incident cause,</text><text x="972" y="428" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >digesters)</text><text x="22" y="443" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Area classification and</text><text x="22" y="456" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ignition control</text><text x="172" y="443" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Flammable liquid zones around pumps, tank vents (PVRV-401, PVRV-402), columns, sieve beds; dust zones at</text><text x="172" y="456" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >ML-101, D-101, CY-101, BF-101, SI-501. Not done here.</text><text x="772" y="443" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >gap: IEC 60079-10, API 505, OISD</text><text x="772" y="456" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >not obtained</text><text x="972" y="443" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >-</text><rect x="20" y="461" width="1100" height="41" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="471" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Dryer and dust protection</text><text x="172" y="471" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Explosion venting XP-501 / 502 / 503, isolation RV-501, spark / CO detection SD-501, deluge DL-501,</text><text x="172" y="484" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >housekeeping, no direct-fired heater (steam tube, A). Vent areas need Kst and Pmax of DDGS dust.</text><text x="772" y="471" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A; vent sizing gap (NFPA 68)</text><text x="972" y="471" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S5 (process safety</text><text x="972" y="484" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >information includes dust</text><text x="972" y="497" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >data)</text><rect x="20" y="90" width="1100" height="412" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><polyline points="170,90 170,502" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="770,90 770,502" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="970,90 970,502" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="512" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="528" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >Inherently safer design options for this process (qualitative; effect numbers are D from the HMB where shown)</text><rect x="20" y="534" width="1100" height="15" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="22" y="544" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >No.</text><text x="72" y="544" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Option</text><text x="592" y="544" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Effect</text><text x="972" y="544" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Source</text><text x="22" y="559" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-1</text><text x="72" y="559" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Substitute: keep molecular-sieve dehydration (no benzene or cyclohexane entrainer, no toxic</text><text x="72" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >solvent inventory).</text><text x="592" y="559" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Already in the process route; keep.</text><text x="972" y="559" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S1 sheet 1 process route</text><text x="972" y="572" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >(template section 4)</text><rect x="20" y="577" width="1100" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="587" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-2</text><text x="72" y="587" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Reduce inventory: size T-101 for hours, not one day (100 m3 as drawn, A), or send product</text><text x="72" y="600" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >straight to T-201A/B.</text><text x="592" y="587" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Removes one flammable inventory and one bund compartment.</text><text x="972" y="587" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="22" y="615" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-3</text><text x="72" y="615" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Moderate conditions: run the columns at the lowest pressure that the condenser allows; beer</text><text x="72" y="628" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >column under vacuum would allow lower-pressure steam and a smaller overpressure case.</text><text x="592" y="615" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Lower relief loads; costs a vacuum system (not assessed).</text><text x="972" y="615" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="633" width="1100" height="41" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="643" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-4</text><text x="72" y="643" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Dryer: sell wet cake / syrup (DWGS) instead of DDGS, or dry only part. The dryer is 37 % of</text><text x="72" y="656" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >LP steam (D) and the only dust-explosion source after the mill; US plants sell 36.7 % of</text><text x="72" y="669" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >DDGS wet.</text><text x="592" y="643" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Removes up to 5,672 kW of the 15,265 kW steam (D) and the dryer,</text><text x="592" y="656" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >cyclone and silo dust hazard; market for wet cake is a business</text><text x="592" y="669" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >question.</text><text x="972" y="643" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >S3 ANL Table 3 (36.7 %)</text><text x="22" y="684" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-5</text><text x="72" y="684" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Simplify CO2 handling: vent fermenter CO2 outdoors through the scrubber, keep fermenters in</text><text x="72" y="697" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >the open or in a ventilated shed with no pits.</text><text x="592" y="684" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Removes the low-level asphyxiant accumulation case.</text><text x="972" y="684" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="702" width="1100" height="28" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="22" y="712" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >ISD-6</text><text x="72" y="712" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Limit mill dust: enclosed mill with dust collector outside the building, explosion vent to</text><text x="72" y="725" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >a safe area.</text><text x="592" y="712" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Removes the building as a confinement for a dust explosion.</text><text x="972" y="712" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="534" width="1100" height="196" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><polyline points="70,534 70,730" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="590,534 590,730" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="970,534 970,730" fill="none" stroke="#ccd" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="8" y="8" width="1584" height="1114" rx="0" fill="none" stroke="#111" stroke-width="2.2"/><rect x="8" y="8" width="1584" height="66" rx="0" fill="#0d1b3e" stroke="none" stroke-width="1.2"/><text x="24" y="38" font-size="13" font-weight="700" text-anchor="start" fill="#9fb4ff" >VertiStrat Solutions LLP</text><text x="24" y="62" font-size="21" font-weight="700" text-anchor="start" fill="#fff" >Safety design basis 4: detection, mitigation and inherently safer design</text><text x="1576" y="38" font-size="13" font-weight="400" text-anchor="end" fill="#fff" >Sheet 8 of 9  |  Drawing VS-ETH-008  |  Rev B</text><text x="1576" y="62" font-size="13" font-weight="700" text-anchor="end" fill="#ffcc80" >CONCEPTUAL P&amp;ID - SCREENING BASIS - NOT FOR CONSTRUCTION</text><rect x="1135" y="960" width="445" height="140" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1143" y="981" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Project</text><text x="1205" y="981" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Grain ethanol (1G) distillery, 100 KLPD</text><polyline points="1135,992 1580,992" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1006" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Sheet</text><text x="1205" y="1006" font-size="11" font-weight="400" text-anchor="start" fill="#111" >8 of 9: F&amp;G, isolation, bund, distances, fire water,</text><text x="1205" y="1018" font-size="11" font-weight="400" text-anchor="start" fill="#111" >ventilation, ISD</text><polyline points="1135,1017 1580,1017" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1031" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Basis</text><text x="1205" y="1031" font-size="11" font-weight="400" text-anchor="start" fill="#111" >DPR template 100 KLPD + stoichiometry, 11 Nov 2026</text><polyline points="1135,1042 1580,1042" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1056" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Prepared</text><text x="1205" y="1056" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Claude Sonnet 5.5 for owner review, 11 Nov 2026</text><polyline points="1135,1067 1580,1067" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1081" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Status</text><text x="1205" y="1081" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Draft B. Screening aid, not certified design</text></svg></section><section class="sheet" id="s9"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>
