t="400" text-anchor="start" fill="#111" >S98 Fig 68</text><rect x="640" y="274.00000000000006" width="480" height="12.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="644" y="282.90000000000003" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >Crude glycerol</text><text x="794" y="282.90000000000003" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >0.15 kg/kg biodiesel</text><text x="999" y="282.90000000000003" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >S98 Tables 13, 14</text><text x="644" y="295.70000000000005" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >Flash recovery vs pressure</text><text x="794" y="295.70000000000005" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >about 90 % at 0.2 atm (simulated)</text><text x="999" y="295.70000000000005" font-size="8.4" font-weight="400" text-anchor="start" fill="#111" >AL14 via GAP_CLOSURE_BIO</text><rect x="640" y="106" width="480" height="193.60000000000008" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="642" y="309.6000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >S1 = VertiStrat_DPR_Templates/Template_DPR_Biodiesel_B100_20KLPD.docx; S2 =</text><text x="642" y="319.2000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Owner_20KLPD_Draft_DPR_v2.docx (private draft, not in repo); S3 =</text><text x="642" y="328.80000000000007" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Biodiesel_18000KL_Sample_DPR_v2.docx; S98 = Sheehan et al., NREL/SR-580-24089</text><text x="642" y="338.4000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >(osti.gov/servlets/purl/1218369); VG04 = Van Gerpen et al., NREL/SR-510-36240; AL14</text><text x="642" y="348.00000000000006" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >= Alam, MASc Univ. Regina 2014 (through GAP_CLOSURE_BIO.md).</tex t="12.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="644" y="443.7000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Glycerol (pure), kg/d</text><text x="794" y="443.7000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >1,785</text><text x="924" y="443.7000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >1,760 crude</text><text x="644" y="456.5000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Crude glycerol, kg/d</text><text x="794" y="456.5000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >2,182</text><text x="924" y="456.5000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >12.4 % of B100 vs 10 %</text><rect x="640" y="460.40000000000015" width="480" height="12.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="644" y="469.3000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Wash water, kg/d</text><text x="794" y="469.3000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >3,524</text><text x="924" y="469.3000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0 (no wash)</text><rect x="640" y="383.6000000000001" width="480" height="89.60000000000008" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="640" y="479.20000000000016" width="480" height="12.8" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="644" y="488.10000000000014" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >DERIVED (D)</text><text x="644" y="500.90000000000015" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >B = 20,000 L/d x 0.88 = 17,600 kg/d; per batch 4,400.0 kg. Oil = B / 0.96 = 4,583.3 kg. TG fraction</text><text x="644" y="510.9000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >solved so stream 22 = B: 95.53 wt%.</text><rect x="640" y="514.8000000000002" width="480" height="22.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="644" y="523.7000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Methanol charge = 6 n_TG M = 950.6 kg; consumed = 3 X n_TG M = 465.8 kg. V-201: stream 4 = (6 + 7) - 5.</text><text x="644" y="533.7000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Column: D(1-xd) + B xb = F_MeOH, D xd + B(1-xb) = F_water.</text><text x="644" y="546.5000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >Duty = sum m cp dT + m lambda; reboiler = D(1+R) lambda(64.5 C) + D cp (64.5-5) + B cp (99-5); T(V-201</text><text x="644" y="556.5000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >out) = mass-weighted mix of 4 and 5.</text><rect x="640" y="479.20000000000016" width="480" height="81.19999999999993" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >METHANOL RECOVERY BASIS (D, frozen tool run)</text><rect x="1135" y="106" width="445" height="13.399999999999999" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="1139" y="115.3" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >P, bar(a) at 80 C</text><text x="1244" y="115.3" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >V-401 MeOH %</text><text x="1329" y="115.3" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >V-401 H2O %</text><text x="1414" y="115.3" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >V-402 MeOH %</text><text x="1499" y="115.3" font-size="8.6" font-weight="700" text-anchor="start" fill="#111" >V-402 H2O %</text><text x="1139" y="128.7" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >1</text><text x="1244" y="128.7" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >19.0</text><text x="1329" y="128.7" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >21.7</text><text x="1414" y="128.7" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >34.5</text><text x="1499" y="128.7" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >28.3</text><rect x="1135" y="132.8" width="445" height="13.399999999999999" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="142.1" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.5</text><text x="1244" y="142.1" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >70.3</text><text x="1329" y="142.1" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >70.6</text><text x="1414" y="142.1" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >78.7</text><text x="1499" y="142.1" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >77.1</text><text x="1139" y="155.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.2</text><text x="1244" y="155.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >89.7</text><text x="1329" y="155.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >89.2</text><text x="1414" y="155.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >92.8</text><text x="1499" y="155.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >92.8</text><rect x="1135" y="159.60000000000002" width="445" height="13.399999999999999" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="168.9" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.1</text><text x="1244" y="168.9" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >95.1</text><text x="1329" y="168.9" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >94.7</text><text x="1414" y="168.9" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >96.6</text><text x="1499" y="168.9" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >96.6</text><text x="1139" y="182.3" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.05</text><text x="1244" y="182.3" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >97.6</text><text x="1329" y="182.3" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >97.4</text><text x="1414" y="182.3" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >98.3</text><text x="1499" y="182.3" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >98.4</text><rect x="1135" y="186.40000000000003" width="445" height="13.399999999999999" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="195.70000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.02</text><text x="1244" y="195.70000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >99.0</text><text x="1329" y="195.70000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >99.0</text><text x="1414" y="195.70000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >99.3</text><text x="1499" y="195.70000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >99.4</text><rect x="1135" y="106" width="445" height="93.80000000000004" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="1141" y="207.80000000000004" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• One equilibrium stage, isothermal flash, UNIFAC-Dortmund activity coefficients (thermo</text><text x="1151" y="218.00000000000003" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >0.6.1), CoolProp vapour pressures, on the Rev B phase compositions. Script:</text><text x="1151" y="228.20000000000005" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >docs/pid/validation/BIODIESEL_REVB_flash_check.py. Methanol-only ester phase (Rev A</text><text x="1151" y="238.40000000000003" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >feed) gives 14.5 % at 1 bar, 69.9 % at 0.5, 89.6 % at 0.2, 95.0 % at 0.1, 99.0 % at 0.02</text><text x="1151" y="248.60000000000002" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >bar (GAP_CLOSURE_BIO).</text><text x="1141" y="261.80000000000007" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• Water flashes with the methanol (Psat water 0.47 bar at 80 C), so the vapour is wet:</text><text x="1151" y="272.00000000000006" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >C-401 dries it to the S98 distillate spec. Glycerol-phase water recovery is partial</text><text x="1151" y="282.20000000000005" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >because glycerol is hygroscopic.</text><text x="1141" y="295.4000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• Condensation: methanol saturates at 15.2 C at 0.10 bar(a); cooling water (about 30 C or</text><text x="1151" y="305.6000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >above) cannot condense it, hence chilled glycol at 5 C. Methanol Psat at 5 C is 0.055</text><text x="1151" y="315.80000000000007" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >bar, so about half of the exhaust gas is methanol: VP-401 exhaust must not go to</text><text x="1151" y="326.0000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >atmosphere (scrubber / back to vent header, A).</text><text x="1141" y="339.2000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• Caveats: no measured methanol / methyl-oleate data were used; soap, NaOH and salts are</text><text x="1151" y="349.4000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >ignored in V-402; real flash would need a thin-film or stripped design for 99 %; confirm</text><text x="1151" y="359.6000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >with a licensor.</text><text x="1141" y="372.8000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• FFA: 1 wt% is the acceptance limit [VG04]; above it add acid esterification (acid</text><text x="1151" y="383.0000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >systems need about 20:1 methanol, same text). Not drawn.</text><text x="1141" y="396.2000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >• Wash: 20 % countercurrent (S98). The DPR no-wash scheme is not adopted because the</text><text x="1151" y="406.4000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >stripped ester still carries residual methanol, soap and sodium; a no-wash alternative</text><text x="1151" y="416.6000000000001" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >needs its own B100 quality basis (IS 15607 not read).</text></svg></section><section class="sheet" id="s4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

#fff" stroke="#2e7d32" stroke-width="1.8"/><text x="433" y="138.4" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >f</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >WHAT IS DRAWN</text><text x="1141" y="120.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Blue star, cloud and pool: S1, release of methanol (toxic and flammable) in the</text><text x="1151" y="131.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >bunded storage and dosing area.</text><text x="1141" y="146.2" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Red flames and arrows: S2, pool fire in the bund and fire at the reactor area;</text><text x="1151" y="157.79999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >thermopack H-901 stands as a possible ignition source, its separation distance is</text><text x="1151" y="169.39999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >an open item.</text><text x="1141" y="184.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Dimmed: units not involved. Green marks are safeguards.</text><rect x="1135" y="202.6" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="218.6" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S1 SAFEGUARDS (numbers)</text><text x="1141" y="238.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 1 Bund and sump around T-201, P-201, V-201 (A).</text><text x="1141" y="253.2" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 2 Gas detectors AT-201A/B to ESD-101 (A).</text><text x="1141" y="267.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 3 XV-201 tank outlet ESD valve, and P-201 / P-202 trip (A).</text><text x="1141" y="282.40000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 4 LSHH-201 high-high level, stops tanker fill via XV-203 (A).</text><text x="1141" y="297.00000000000006" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 5 N2 blanket and PVRV-201 with flame arrester on T-201 and V-201 (A).</text><text x="1141" y="311.6000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 6 ES-301 emergency shower and eyewash (A), for skin and eye contact.</text><text x="1141" y="326.2000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 7 Fire-fighting (R: DPR risk line); ESD-101 logic (A).</text><rect x="1135" y="344.8000000000001" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="360.8000000000001" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S2 SAFEGUARDS (letters)</text><text x="1141" y="380.8000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• a Flame detector BE-201; b flame detector BE-301 (A), to ESD-101.</text><text x="1141" y="395.40000000000015" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• c Water spray / foam on T-201 (R: DPR 'fire-fighting'); foam type for a water-</text><text x="1151" y="407.00000000000017" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >miscible fuel is an open item.</text><text x="1141" y="421.60000000000014" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• d ESD-101 closes XV-201, XV-202, XV-301A/B and trips XV-901 (A).</text><text x="1141" y="436.20000000000016" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• e Bund limits pool area (A). f PSV-301A/B relieve reactor pressure under fire (A,</text><text x="1151" y="447.8000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >not sized).</text><rect x="1135" y="468.40000000000015" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="484.40000000000015" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >INVENTORIES FROM THE HMB (D, sheet 2)</text><rect x="1135" y="490.40000000000015" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="500.70000000000016" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Methanol charge per batch, streams 6 + 7 (MeOH)</text><text x="1394" y="500.70000000000016" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >950.6 kg; 1.20 m3 at 790 kg/m3 (A)</text><text x="1139" y="515.3000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Methanol consumed by reaction per batch</text><text x="1394" y="515.3000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >465.8 kg</text><rect x="1135" y="519.6000000000001" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="529.9000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Recovered methanol, stream 5, per batch</text><text x="1394" y="529.9000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >461.4 kg</text><text x="1139" y="544.5000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Unreacted methanol in reactor effluent (10)</text><text x="1394" y="544.5000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >484.8 kg per batch</text><rect x="1135" y="548.8000000000002" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="559.1000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Fresh methanol per day (stream 4 x 4)</text><text x="1394" y="559.1000000000001" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >1,958 kg (DPR line: 1,937)</text><text x="1139" y="573.7000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >NaOH per batch / per day (stream 8)</text><text x="1394" y="573.7000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >44.0 kg / 176 kg</text><rect x="1135" y="578.0000000000002" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="588.3000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Wash water out per batch (stream 19)</text><text x="1394" y="588.3000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >843.9 kg incl. 6.8 kg methanol</text><text x="1139" y="602.9000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Thermal oil duty at users (24 h average)</text><text x="1394" y="602.9000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >172.1 kW (A cp, latent)</text><rect x="1135" y="490.40000000000015" width="445" height="116.80000000000013" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="1135" y="613.2000000000003" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="629.2000000000003" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >CONSEQUENCE NUMBERS: NOT RUN</text><text x="1141" y="649.2000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >The toolkit has stdlib models that could size a release or a pool fire</text><text x="1141" y="660.8000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(process_safety.release.liquid_release_kg_s, pool_spread, pool_fire, relief), but</text><text x="1141" y="672.4000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >each needs inputs this project does not have: hole size and head, bund area, tank</text><text x="1141" y="684.0000000000002" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >volume and count, layout distances, wind, vessel MAWP and relief set pressure,</text><text x="1141" y="695.6000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >thermal oil type and inventory. No distance, rate or frequency is quoted. Each</text><text x="1141" y="707.2000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >scenario row below says what it needs.</text><rect x="1135" y="726.8000000000003" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="742.8000000000003" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SOURCE LINES USED (S)</text><text x="1141" y="762.8000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Methanol and biodiesel storage needs a PESO licence; risk line 'Methanol storage</text><text x="1151" y="774.4000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >hazard: PESO-compliant tanks, fire-fighting, hazard study' (S1 s6, s12; S2 s6,</text><text x="1151" y="786.0000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >s11).</text><text x="1141" y="800.6000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Batch transesterification at about 40 C, six hours per batch, thermopack in</text><text x="1151" y="812.2000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >utilities (S2 s5, s7; S1 s7).</text><text x="1141" y="826.8000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Scheme with no water wash and no process effluent (S2 s5; S3 s5): C-501 and the</text><text x="1151" y="838.4000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >wash-water scenario are A.</text><text x="1141" y="853.0000000000003" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Everything else on these sheets (detectors, ESD, vents, N2, relief) is A: the DPR</text><text x="1151" y="864.6000000000004" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >files list none of it.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative; no distance, rate or frequency is quoted)</text><rect x="20" y="806" width="1100" height="15.4" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="142" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="332" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="560" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (numbers / letters on drawing)</text><text x="868" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >S1 Methanol release,</text><text x="24" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >storage and dosing area</text><text x="24" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >(T-201, P-201, V-201,</text><text x="24" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >P-202)</text><text x="142" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Leak or seal failure on P-201 / P-202,</text><text x="142" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >flange or hose failure, tanker hose</text><text x="142" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >failure during fill, overfill of T-201</text><text x="142" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >or V-201.</text><text x="332" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Flammable liquid pool in the bund and</text><text x="332" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >flammable vapour cloud (flash fire if ignited;</text><text x="332" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >explosion in a congested area not assessed).</text><text x="332" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Toxic by inhalation, ingestion and skin</text><text x="332" y="876.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >(general knowledge, check the SDS). Methanol</text><text x="332" y="887.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >burns with a faint flame (general, confirm).</text><text x="560" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >1 bund and sump (A); 2 gas detectors AT-201A/B to ESD-101 (A);</text><text x="560" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >3 XV-201 and pump trip (A); 4 LSHH-201 stops fill (A); 5 N2</text><text x="560" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >blanket + PVRV-201 + flame arrester (A); 6 shower / eyewash</text><text x="560" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >(A); 7 fire-fighting (R) and ESD-101 (A).</text><text x="868" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Tank size and count, bund area and volume, hole</text><text x="868" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >size and head, ignition sources, wind, boundary and</text><text x="868" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >building distances, detector set points. PESO</text><text x="868" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >licensing class and distances are not in the source</text><text x="868" y="876.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >files. Not quantified: needs these.</text><rect x="20" y="891.8" width="1100" height="59.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >S2 Fire in the methanol</text><text x="24" y="913.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >tank farm or reactor</text><text x="24" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >area</text><text x="142" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Ignition of an S1 release, hot work,</text><text x="142" y="913.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >static discharge during transfer,</text><text x="142" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >thermal oil leak on a hot surface,</text><text x="142" y="935.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >electrical fault at the reactor area.</text><text x="332" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Pool fire in the bund with radiant heat on</text><text x="332" y="913.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >T-201, V-201 and the reactors; reactor</text><text x="332" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >contents (about 951 kg methanol per batch, D)</text><text x="332" y="935.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >heat and vent via PSV-301A/B. Escalation to</text><text x="332" y="946.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >the thermopack or to tankers is an open item.</text><text x="560" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >a, b flame detectors (A); c spray / foam on T-201 (R); d ESD</text><text x="560" y="913.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >closes XV-201, XV-202, XV-301A/B and trips XV-901 (A); e bund</text><text x="560" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >(A); f PSV-301A/B (A).</text><text x="868" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Layout and spacing (none in source files), fire-</text><text x="868" y="913.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >water source and rate, foam type and rate, reactor</text><text x="868" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >design pressure, PSV set and fire-case load,</text><text x="868" y="935.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >radiant heat targets. Not quantified: needs bund</text><text x="868" y="946.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >area, burning rate inputs and layout.</text><rect x="20" y="806" width="1100" height="145.19999999999993" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

ont-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S3 SAFEGUARDS (numbers)</text><text x="1141" y="238.59999999999997" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 1 TSHH-301 reactor high-high temperature closes TCV-301A/B and trips XV-901 (A).</text><text x="1141" y="253.19999999999996" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 2 PT-301 PAHH closes XV-301A/B and TCV-301A/B (A).</text><text x="1141" y="267.79999999999995" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 3 PSV-301A/B to the vent header, KO-301 catch pot and flame arrester FA-301, stack</text><text x="1151" y="279.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >to a safe location (A; set pressure and design pressure open; sizing on sheet 6).</text><text x="1141" y="293.99999999999994" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 4 TSHH-901 and FSLL-901 trip the burner (A). 5 XV-901 fuel shut-off (A). 6 TIC-301</text><text x="1151" y="305.59999999999997" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >normal control of TCV-301A/B (A).</text><rect x="1135" y="324.19999999999993" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="340.19999999999993" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S4 SAFEGUARDS (numbers, amber)</text><text x="1141" y="360.19999999999993" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 1 H-301 enclosed tipping station with dust extraction (A). 2 ES-301 shower and</text><text x="1151" y="371.79999999999995" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >eyewash (A). 3 LSH-311 high level on M-301 (A).</text><text x="1141" y="386.3999999999999" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• 4 FCV-501 sets wash ratio (A). 5 AT-501 pH / conductivity on stream 19 to divert</text><text x="1151" y="397.99999999999994" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >off-spec water (A). 6 LIC-501 holds the wash level (A).</text><rect x="1135" y="416.5999999999999" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="432.5999999999999" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S5 SAFEGUARDS (roman, purple)</text><text x="1141" y="452.5999999999999" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• i PAL-951 low N2 pressure alarm (A). ii PVRV-201 and flame arrester keep a</text><text x="1151" y="464.19999999999993" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >breathing path (A). iii ESD-101 stops transfer pumps on low N2 (A). iv FA-301 vent</text><text x="1151" y="475.7999999999999" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >line kept clear: inspect (A).</text><rect x="1135" y="496.3999999999999" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="512.3999999999999" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >INVENTORIES FROM THE HMB (D, sheet 2)</text><rect x="1135" y="518.3999999999999" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="528.6999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Methanol charge per batch, streams 6 + 7 (MeOH)</text><text x="1394" y="528.6999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >950.6 kg; 1.20 m3 at 790 kg/m3 (A)</text><text x="1139" y="543.2999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Unreacted methanol in reactor effluent (10)</text><text x="1394" y="543.2999999999998" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >484.8 kg per batch</text><rect x="1135" y="547.5999999999999" width="445" height="14.6" rx="0" fill="#f6f7fa" stroke="none" stroke- 00" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative; no distance, rate or frequency is quoted)</text><rect x="20" y="806" width="1100" height="15.4" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="142" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="332" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="560" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (numbers / letters on drawing)</text><text x="868" y="816.7" font-size="9" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >S3 Reactor overpressure</text><text x="24" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >or thermopack failure</text><text x="142" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >TCV-301 sticks open, TIC-301 or TT</text><text x="142" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >fails low, H-901 control or burner</text><text x="142" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >fails high, vent or PSV path blocked,</text><text x="142" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >thermal oil pump P-901 stops with</text><text x="142" y="876.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >burner on, thermal oil leak.</text><text x="332" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Reactor heats above 40 C with about 951 kg</text><text x="332" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >methanol per batch (D): vapour pressure rise,</text><text x="332" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >release via PSV-301 to the vent. Thermal oil</text><text x="332" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >leak on a hot surface: fire. Overheated oil in</text><text x="332" y="876.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >the heater coil.</text><text x="560" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >1 TSHH-301; 2 PAHH-301; 3 PSV-301A/B + FA-301; 4 TSHH-901 /</text><text x="560" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >FSLL-901 burner trip; 5 XV-901; 6 TIC-301 (all A).</text><text x="868" y="832.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Reactor design pressure and temperature, PSV set</text><text x="868" y="843.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >and relief case (not sized), thermal oil type,</text><text x="868" y="854.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >flash point, inventory and operating temperature,</text><text x="868" y="865.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >jacket limits, vent size and discharge location.</text><text x="868" y="876.1" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Not quantified.</text><rect x="20" y="880.8" width="1100" height="81.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="891.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >S4 NaOH / KOH catalyst</text><text x="24" y="902.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >handling and wash water</text><text x="142" y="891.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Bag-tipping spill or dust at H-301,</text><text x="142" y="902.5" font-size="9" font-weight="400" text-anchor="start" 3.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >in the source files), SDS data. Confirm with the</text><text x="868" y="924.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >technology supplier whether a wash is used. Not</text><text x="868" y="935.5" font-size="9" font-weight="400" text-anchor="start" fill="#111" >quantified.</text><text x="24" y="972.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >S5 Loss of nitrogen or</text><text x="24" y="983.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >vent blocked</text><text x="142" y="972.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >N2 supply or regulator fails, N2</text><text x="142" y="983.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >header pressure falls while pumping</text><text x="142" y="994.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >out; vent line, PVRV-201 or flame</text><text x="142" y="1005.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >arrester FA-301 blocked; vacuum is</text><text x="142" y="1016.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >lost or air leaks into</text><text x="142" y="1027.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >V-401/V-402/V-403/V-601 (VP-401</text><text x="142" y="1038.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >trips).</text><text x="332" y="972.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Air ingress into vessels holding methanol</text><text x="332" y="983.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >vapour gives a flammable atmosphere inside the</text><text x="332" y="994.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >vessel. Blocked vent: overpressure of</text><text x="332" y="1005.9" font-size="9" font-weight="400" text-anchor="start" fill="#111" >reactors, vacuum collapse or 2.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >H-901, V-901 thermopack</text><text x="142" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >TO circuit, vendor</text><text x="347" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >loss of flow, over-temperature, coil leak, TO expansion</text><text x="677" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >V-901 vent and coil protection (vendor package, not</text><text x="677" y="433.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >drawn)</text><text x="912" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >safe location</text><text x="1102" y="423.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >vendor package; TO type and temperature not in sources</text><text x="24" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >N2 header</text><text x="142" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >regulator outlet A</text><text x="347" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >PCV failure open</text><text x="677" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >PSV on header (A, not drawn)</text><text x="912" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >safe location</text><text x="1102" y="446.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >not sized</text><rect x="20" y="106" width="1560" height="344.80000000000007" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="20" y="458.80000000000007" width="760" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="474.80000000000007" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >BUND, DISTANCES, FIRE WATER (R, A, gap)</text><rect x="20" y="480.80000000000007" width="760" height="13.0" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="489.7000000000001" font-size="8.2" font-weight="700" text-anchor="start" fill="#111" >Topic</text><text x="154" y="489.7000000000001" font-size="8.2" font-weight="700" text-anchor="start" fill="#111" >Basis</text><text x="24" y="502.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Bund / dyke (R)</text><text x="154" y="502.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Rule read in HSG176 (checklist, para 157): capacity 110 % of the largest vessel, or 25 % of total tank capacity; take the greater (A reading,</text><text x="154" y="512.5000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >confirm in the text). T-201 volume is TBD. Illustration only (A): 7 days of fresh methanol 1,958 kg/d = 17.3 m3 at 790 kg/m3, bund at least</text><text x="154" y="522.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >19.1 m3. V-201 holds one batch charge 951 kg = 1.20 m3 (D).</text><rect x="20" y="526.4000000000001" width="760" height="22.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="535.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >PESO / licence</text><text x="154" y="535.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >gap: Petroleum Rules 2002 and SMPV(U) Rules 2016 (peso.gov.in did not connect, only snippets). Licence class, storage quantity limits and</text><text x="154" y="545.1000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >distances not stated here.</text><text x="24" y="558.1" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Safety distances (R)</text><text x="154" y="558.1" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >HSG176 Table 1: 1 m (tank up to 1 m3) to 15 m (over 250 m3) from boundaries, buildings and ignition sources; HSE layout guidance: address</text><text x="154" y="567.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >domino escalation and occupied buildings. T-201 distance depends on its volume (TBD). H-901 (burner, ignition source) to methanol area and</text><text x="154" y="577.7" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >glycerol/biodiesel tanks: distance not set (gap).</text><rect x="20" y="581.8000000000001" width="760" height="22.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="590.7" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Fire water / foam (R, rates</text><text x="24" y="600.5000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >gap)</text><text x="154" y="590.7" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >DPR risk line: hydrants and spray / foam. Rates, hydrant layout and foam concentrate: gap (OISD standards and NFPA 30 / 15 are paywalled).</text><text x="154" y="600.5000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Methanol is water-miscible, so confirm an alcohol-resistant foam (general knowledge, check).</text><rect x="20" y="480.80000000000007" width="760" height="123.79999999999995" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="800" y="458.80000000000007" width="780" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="808" y="474.80000000000007" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DETECTION, ISOLATION, INERTING AND HAZARD-SPECIFIC BASIS (R, A, gap)</text><rect x="800" y="480.80000000000007" width="780" height="13.0" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="804" y="489.7000000000001" font-size="8.2" font-weight="700" text-anchor="start" fill="#111" >Topic</text><text x="934" y="489.7000000000001" font-size="8.2" font-weight="700" text-anchor="start" fill="#111" >Basis</text><text x="804" y="502.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Gas detection (R)</text><text x="934" y="502.7000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >AT-201A/B at T-201 / P-201 / V-201 / tanker manifold; AT-301 at the reactor area; AT-401 at the vacuum / column package. Place at likely leak</text><text x="934" y="512.5000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >points (seals, flanges, manifolds, sample points); methanol vapour is about 1.1 x air (32.04 / 28.96) so no strong low or high bias: mount around 1</text><text x="934" y="522.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >m (A). Set points and voting TBD (A). Source: gas detectors in hazard areas, IFC EHS nitrogenous fertilizer guideline (checklist S8).</text><rect x="800" y="526.4000000000001" width="780" height="13.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="535.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Flame detection</text><text x="934" y="535.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >BE-201, BE-301, BE-401. Methanol flame is hard to see (general knowledge, check SDS): use UV/IR type (A).</text><text x="804" y="548.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Isolation of inventory (R)</text><text x="934" y="548.3000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >XV-201 (T-201 outlet), XV-203 (tanker fill), XV-202 (dose line), XV-301A/B (reactors), XV-401 (C-401 reboiler heat), XV-901 (burner fuel); fail-</text><text x="934" y="558.1000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >closed, remote push-button in the control room (A). HSG176 para 128: remote shut-off valves on large inventories, fail safe.</text><rect x="800" y="562.2" width="780" height="22.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="571.1" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Ventilation / inerting</text><text x="934" y="571.1" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Open-air process structure (A). N2 blanket on T-201, V-201, M-301, R-301A/B; vacuum vessels are never opened to air except through a PCV N2 break.</text><text x="934" y="580.9000000000001" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >N2 asphyxiation at vents and in vessels: confined-space rule (general).</text><text x="804" y="593.9" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Methanol inventory</text><text x="934" y="593.9" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Upper bound outside T-201 (D): R-301A + R-301B charges 2 x 951 kg, V-201 batch charge 951 kg, V-302 about 485 kg, plus C-401 / V-403 hold-up (not</text><text x="934" y="603.7" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >sized): about 3,337 kg. Flammable and toxic (inhalation, ingestion, skin; general, check SDS). Threshold check against the MAH rules: gap.</text><rect x="800" y="607.8" width="780" height="32.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="616.6999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Vacuum system</text><text x="934" y="616.6999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Air in-leak plus methanol vapour gives a flammable mixture inside V-403, VP-401 and its exhaust: methanol Psat at 5 C is 0.055 bar, i.e. 5.5 vol %</text><text x="934" y="626.5" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >at 1 bar exhaust (CoolProp), flammable limits not entered (gap). Vessels FV-rated; check valve against suck-back; exhaust to scrubber or safe</text><text x="934" y="636.3" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >location, not into the process area; N2 purge on VP-401 (A).</text><text x="804" y="649.3" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Thermopack</text><text x="934" y="649.3" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Fuel type and BMS per vendor; free boiler / thermal-fluid heater guidance not found (HSE PM5 404): gap. TO leak on hot surface near methanol is a</text><text x="934" y="659.1" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >fire route (S3). TO type, flash point and film temperature not in sources.</text><rect x="800" y="663.1999999999999" width="780" height="22.8" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="672.0999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Caustic (NaOH)</text><text x="934" y="672.0999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >44.0 kg NaOH per batch (D). Enclosed bag-tipping hopper H-301 with dust extraction, ES-301 shower and eyewash, M-301 high level LSH-311;</text><text x="934" y="681.9" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >dissolution in methanol releases heat (general, not quantified). Corrosive to skin and eyes (check SDS).</text><text x="804" y="694.8999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Hazardous-area basis</text><text x="934" y="694.8999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Zone from release grade and ventilation (toolkit atex.zone, medium dilution, good availability): continuous grade zone 0, primary 1, secondary 2.</text><text x="934" y="704.6999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >Apply: inside T-201, V-201 and C-401 headspace zone 0; vent outlets (PVRV-201/202, FA-301 stack) and open sample points zone 1; pump seals,</text><text x="934" y="714.4999999999999" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >flanges, valves zone 2. Extents are not computed. Gas group and temperature class of methanol, EPL and equipment category: not entered (IEC</text><text x="934" y="724.3" font-size="8.2" font-weight="400" text-anchor="start" fill="#111" >60079-10-1 and the SDS are not in the sources, gap). H-901 and non-Ex equipment kept outside classified areas: distance gap.</text><rect x="800" y="480.80000000000007" width="780" height="247.5999999999998" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>
