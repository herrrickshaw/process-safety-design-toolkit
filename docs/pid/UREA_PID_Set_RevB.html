" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Seal, flange or nozzle failure at</text><text x="144" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >T-501 outlet / P-501 suction (A1),</text><text x="144" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >or leak on the V-401 liquid line</text><text x="144" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(A2); overfill via LV-401 failure.</text><text x="334" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Toxic NH3 cloud at ground level. Pressurised liquid</text><text x="334" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >flashes and chills, aerosol can travel as a dense</text><text x="334" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >cloud. Corrosive to eyes and skin. Narrow flammable</text><text x="334" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >range, so fire is secondary. Not quantified.</text><text x="614" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >AT-501 and AT-401 NH3 detectors; XV-501 remote isolation</text><text x="614" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >at the tank outlet; XV-502 on V-401 liquid; P-501 trip;</text><text x="614" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >LSHH-501 high-level cutoff; bund, sump and water spray;</text><text x="614" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PSV-501 vent to scrubber (sheet 1).</text><text x="904" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Not quantified: needs T-501 and loop</text><text x="904" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >inventory, storage type, pressure and</text><text x="904" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >temperature, hole size, release height,</text><text x="904" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >wind data, toxic end-point criteria,</text><text x="904" y="880.2" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >receptor distances.</text><polyline points="20,887.5 1120,887.5" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="887.5" width="1100" height="64.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="899.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >B  Syngas (CO / H2 /</text><text x="24" y="910.8" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >H2S) release and fire</text><text x="144" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Flange or gasket leak, or pipe</text><text x="144" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >failure, on raw syngas S4 / S7</text><text x="144" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >between R-101 and the shift section</text><text x="144" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(B1); gasifier trip leaving hot gas</text><text x="144" y="944.7" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >in line.</text><text x="334" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Toxic CO and H2S. H2 and CO flammable: jet fire, flash</text><text x="334" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fire, or explosion if confined. Hot lines (1400 C at</text><text x="334" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >the gasifier outlet, 350 C at HT shift) make ignition</text><text x="334" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >likely. Not quantified.</text><text x="614" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >AT-102, AT-201 CO/H2 detectors; BE-101 flame detector;</text><text x="614" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-101 (O2), XV-102 (coal), XV-103 (steam) trip on ESD-1;</text><text x="614" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >BDV-101 blowdown to FL-1; PSV-101 to FL-1; fire</text><text x="614" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >protection on supports.</text><text x="904" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Not quantified: needs R-101 operating</text><text x="904" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pressure, inventory between isolation</text><text x="904" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >valves, hole sizes, congestion and</text><text x="904" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >confinement, ignition sources, H2S limits</text><text x="904" y="944.7" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >for the site.</text><polyline points="20,952.0 1120,952.0" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="806" width="1100" height="146.0" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

Z" fill="#fff"/></g><text x="1190" y="556.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD valve, closes on ESD logic (A)</text><text x="1145" y="586.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Safeguards are A unless marked R. R items (named free sources) are on sheets</text><text x="1145" y="599.0" font-size="10" font-weight="400" text-anchor="start" fill="#666" >5-7. Hazard text is qualitative; the only number in the scenarios is the repo-</text><text x="1145" y="611.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >fit sensitivity in D.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE   (qualitative; open data needs are listed rather than assumed)</text><rect x="20" y="806" width="1100" height="17" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="818" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="144" y="818" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="334" y="818" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="614" y="818" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (A; R on sheets 5-7)</text><text x="904" y="818" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="835.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >C  HP steam or oxygen</text><text x="24" y="846.3" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >fire in the gasifier</text><text x="24" y="857.6" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >area</text><text x="144" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Ignition or failure on the O2 feed</text><text x="144" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >to R-101 (C1); rupture of the HP</text><text x="144" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >steam feed (C2); loss of O2:coal</text><text x="144" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ratio control during a trip.</text><text x="334" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Oxygen-enriched fire ignites organic material and metal</text><text x="334" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >quickly and can spread to the coal feed and syngas</text><text x="334" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >lines. A steam jet scalds, strips insulation and can</text><text x="334" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >damage nearby cables and instruments. Not quantified.</text><text x="614" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-101 O2 isolation and XV-103 steam isolation on ESD-3;</text><text x="614" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-102 coal stop; FIC-102 with flow trip; O2 line built</text><text x="614" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >and cleaned for oxygen service; BE-101 flame / heat</text><text x="614" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >detector; O2 and coal lines separated.</text><text x="904" y="835.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Not quantified: needs O2 pressure and</text><text x="904" y="846.3" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >velocity limits, material and cleanliness</text><text x="904" y="857.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >requirements from the licensor and a named</text><text x="904" y="868.9" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >standard, steam pressure and temperature,</text><text x="904" y="880.2" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >line sizes, layout.</text><polyline points="20,887.5 1120,887.5" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="887.5" width="1100" height="64.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="899.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >D  Urea reactor or CO2</text><text x="24" y="910.8" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >compressor failure</text><text x="144" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >K-601 trip, surge or mechanical</text><text x="144" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >failure (D1) with NH3 feed</text><text x="144" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >continuing; leak, blockage or</text><text x="144" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >overpressure at R-601 / C-601 (D2).</text><text x="334" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >NH3-rich hot mixture at 150 bar is toxic and corrosive</text><text x="334" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >if released. Without CO2 the NH3 feed can raise</text><text x="334" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pressure; solid carbamate can block lines if the loop</text><text x="334" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >cools. Output sensitivity from the repo fit is on the</text><text x="334" y="944.7" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >card; safety consequence not quantified.</text><text x="614" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >UIC-601 anti-surge and K-601 trip; FALL-602 low CO2 flow</text><text x="614" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >closes XV-603 on the NH3 feed and trips P-501; XV-602 CO2</text><text x="614" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >isolation; PSV-601 to scrubber; AT-601 NH3 detector.</text><text x="904" y="899.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Not quantified: needs R-601 / C-601</text><text x="904" y="910.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >inventory, relief cases and rates,</text><text x="904" y="922.1" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >carbamate crystallisation margins from the</text><text x="904" y="933.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >licensor, K-601 data, scrubber capacity.</text><polyline points="20,952.0 1120,952.0" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="806" width="1100" height="146.0" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>
