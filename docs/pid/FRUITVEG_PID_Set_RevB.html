ont-weight="400" text-anchor="start" fill="#111" >Peel/cut water (35, 36) at PE-401 (S, BREF).</text><text x="1145" y="589" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Relief (Rev B): PSV-301 on E-301, PSV-401 / 402 on F-401 / CS-401 into</text><text x="1145" y="601" font-size="10" font-weight="400" text-anchor="start" fill="#111" >RH-701, VB-201 on DA-201, PSV-501 / 502 / 701 as before. Set pressures are</text><text x="1145" y="613" font-size="10" font-weight="400" text-anchor="start" fill="#111" >A; see the key below the drawing. Open-vent vessels carry no valve in the</text><text x="1145" y="625" font-size="10" font-weight="400" text-anchor="start" fill="#111" >vent.</text><text x="1145" y="641" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Not drawn: instrument air and cooling-water packages, chiller package,</text><text x="1145" y="653" font-size="10" font-weight="400" text-anchor="start" fill="#111" >fire water, product pumps other than P-201, SIP supply to AF-301, cold-</text><text x="1145" y="665" font-size="10" font-weight="400" text-anchor="start" fill="#111" >store defrost. Line sizes and numbers TBD (A).</text><rect x="1135" y="683" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="699" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >EQUIPMENT (descriptions A; R where the source names the function)</text><text x="1141" y="719.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R-101 receiving, sorting belt</text><text x="1362" y="719.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PE-401 peel / trim / cut</text><text x="1141" y="730.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >W-102 drum washer</text><text x="1362" y="730.8" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >B-401 IQF blancher, direct steam</text><text x="1141" y="742.6" font-size="9.5" font-weight=" g/yr (section 9); HACCP, in-house lab, batch traceability (section 12).</text><text x="26" y="307" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S  EU JRC FDM BREF (JRC118627, Dec 2019): Table 8.3 (36.5 kg COD/t, abrasion + knife peeling), Table 8.4 (66.3, caustic), sec 8.2.1 (peeling wastewater about 4,000-5,000 mg/L), sec 8.2.2.4 (drum cooler 2-4</text><text x="26" y="319" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >L/kg), Tables 8.6-8.7 (blancher steam 0.09 / 0.16 t/t), sec 8.1 (freezing 80-280 kWhe/t), Table 8.10 (water 5.0-8.5 m3/t frozen). IFC EHS Food and Beverage 2007 Tables 1, 2. IAPWS R10-06(2009) (ice cp,</text><text x="26" y="331" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >latent heat).</text><text x="26" y="346" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >D  operating days = 10,000 / 50 = 200.  Blancher Q = (m_fruit cp + m_MU cp_w)(Tb - Ta) x 1.15; steam = Q / (hfg + cp_w (Tsat - Tb)).  Deaerator T_out = T_in - loss x hfg_vac / cp.  Pasteuriser Q = m cp dT.</text><text x="26" y="358" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Drum cooler Q = m cp (85 - 33); water outlet = Ta + Q / (m_w cp_w).  Freezing Q = m [cp (Ti - Tfp) + x_w x_f L + cp_frozen (Tfp - Tout)], cp_frozen = x_w x_f cp_ice + x_w (1 - x_f) cp_w + (1 - x_w) cp_dm.</text><text x="26" y="370" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Peel water = COD / concentration; COD load = 36.5 kg/t x IQF product.  COD = dry matter x 1.1.</text><rect x="20" y="388" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="404" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SENSITIVITIES (D: balance re-run with the changed input; base = Rev B)</text><rect x="20" y="410" width="1100" height="16" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="420" font-size="9.5" font-weight="700" text- on from 0 to -1.5 C (A).</text><text x="1145" y="214" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Steam: /private/tmp/claude-501/venv_val/bin/python, CoolProp 8.0.0, PropsSI at</text><text x="1155" y="226" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >4.0 and 0.2 bar: Tsat 143.608 C, hfg 2,133.398 kJ/kg; hfg 2,357.513 kJ/kg at 0.2</text><text x="1155" y="238" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >bar (Tsat 60.06 C).</text><text x="1145" y="255" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Refrigeration COP: same interpreter, CoolProp R717 (ammonia, a conditional case</text><text x="1155" y="267" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >only), single stage, eta_is 0.7, saturated suction, saturated liquid at 35 C</text><text x="1155" y="279" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(A): -35 C evaporating 1.76, -40 C 1.56. Not a statement that the plant uses</text><text x="1155" y="291" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ammonia.</text><text x="1145" y="308" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Not run: DWSIM (not installed); BioSTEAM has no fruit-and-vegetable model.</text><rect x="1135" y="329" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="345" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >STILL OPEN AGAINST THE REFERENCES</text><text x="1145" y="365" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Whole-plant COD 11.5 kg/t product stays below 36.5 because the pulp line is</text><text x="1155" y="377" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >unpeeled (A15); the peeled IQF line is 38.7.</text><text x="1145" y="393" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Blancher steam 0.163 t/t versus 0.09 (belt + water cooler): the difference is</text><text x="1155" y="405" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >the heat recovery that is not drawn.</text><text x="1145" y="421" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Compressor electricity 63-72 kWhe/t versus BREF 80-280: BREF includes fans and</text><text x="1155" y="433" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >auxiliaries.</text><text x="1145" y="449" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Pulp-line yield 83.9 % versus 77.9 % mango (grade C): crop open.</text><text x="1145" y="465" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• IQF share, pasteuriser steam per t, hot-fill / aseptic split, cold-store load,</text><text x="1155" y="477" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >boiler fuel: no source found.</text></svg></section><section class="sheet" id="s4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

" text-anchor="start" fill="#c62828" >emergency extract EF-701 (all A).</text><text x="38" y="658.0" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >• Duty context (D): IQF refrigeration load about 51 kW (41 kW product). Charge and compressor size</text><text x="48" y="671.5" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >come from the vendor.</text><rect x="580" y="84" width="540" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="588" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 2: boiler or steam-header release</text><g transform="translate(598,252) scale(1.65)"><rect x="0" y="0" width="306" height="200" rx="0" fill="#fffaf2" stroke="#b26a00" stroke-width="1.8" stroke-dasharray="9 5"/><text x="36" y="14" font-size="10.5" font-weight="700" text-anchor="start" fill="#b26a00" >BH-501 (A)</text><path d="M56.0,84 A28.0,15.680000000000001 0 0 1 112.0,84 V140 A28.0,15.680000000000001 0 0 1 56.0,140 Z" fill="#fff" stroke="#111" stroke-width="2.4"/><text x="2" y="176" font-size="10" font-weight="700" text-anchor="start" fill="#111" >BL-501</text><text x="2" y="188" font-size="9" font-weight="400" text-anchor="start" fill="#111" >boiler (R)</text><polyline points="0,122 56,122" fill="none" stroke="#b26a00" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="47,117.5 56,122 47,126.5" fill="#b26a00"/><g transform="translate(22,122) rotate(0)" stroke="#b26a00" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><circle r="3.4" fill="#b26a00"/><line x1="0" y1="0" x2="0" y2="-15"/><path d="M-9,-15 A9,9 0 0 1 9,-15 Z" fill="#fff"/></g><text x="22" y="140" font-size="9" font-weight="700" text-anchor="middle" fill="#111" >XV-501</text><text x="22" y="151" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >fuel (A)</text><polyline points="84,68 84,56 302,56" fill="none" stroke="#b26a00" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="293,51.5 302,56 293,60.5" fill="#b26a00"/><polyline points="104,56 104,52" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(104,36)" stroke="#c62828" stroke-width="1.8" fill="#fff"><polygon points="-10,16 10,16 0,-2"/><polygon points="0,-2 18,-10 18,10" /><polyline points="0,-2 0,-8 -6,-12 6,-17 -6,-22 6,-27 0,-31" fill="none"/></g><polyline points="122,36 140,36 140,20" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M133,18 Q140,9 147,18" fill="none" stroke="#111" stroke-width="2"/><text x="124" y="50" font-size="9" font-weight="700" text-anchor="start" fill="#111" >PSV-501</text><g transform="translate(190,56) rotate(0)" stroke="#b26a00" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><line x1="0" y1="0" x2="0" y2="-15"/><path d="M-9,-15 A9,9 0 0 1 9,-15 Z" fill="#fff"/></g><text x="172" y="72" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >XV-502</text><text x="172" y="83" font-size="9" font-weight="400" text-anchor="start" fill="#111" >steam ESDV (A)</text><polyline points="240,56 240,52" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(240,36)" stroke="#c62828" stroke-width="1.8" fill="#fff"><polygon points="-10,16 10,16 0,-2"/><polygon points="0,-2 18,-10 18,10" /><polyline points="0,-2 0,-8 -6,-12 6,-17 -6,-22 6,-27 0,-31" fill="none"/></g><polyline points="258,36 276,36 276,20" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M269,18 Q276,9 283,18" fill="none" stroke="#111" stroke-width="2"/><text x="258" y="50" font-size="9" font-weight="700" text-anchor="start" fill="#111" >PSV-502</text><text x="302" y="96" font-size="9.5" font-weight="700" text-anchor="end" fill="#b26a00" >steam 4 bar(a) (A)</text><text x="302" y="108" font-size="9" font-weight="400" text-anchor="end" fill="#111" >to B-201, E-301, B-401</text><text x="302" y="119" font-size="9" font-weight="400" text-anchor="end" fill="#111" >(stubs, sheet 1)</text><circle cx="134" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="1.6"/><line x1="119" y1="102" x2="149" y2="102" stroke="#111" stroke-width="1.2"/><text x="134" y="100" font-size="8" font-weight="700" text-anchor="middle" fill="#111" >LSLL</text><text x="134" y="112" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >501</text><polyline points="112,102 119,102" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="134" cy="136" r="15" fill="#fff" stroke="#111" stroke-width="1.6"/><line x1="119" y1="136" x2="149" y2="136" stroke="#111" stroke-width="1.2"/><text x="134" y="134" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >PT</text><text x="134" y="146" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >501</text><polyline points="112,136 119,136" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="197.0" y="177.0" width="56" height="18.0" fill="#cfe6f7"/><polyline points="197.0,195 197.0,165 253.0,165 253.0,195" fill="none" stroke="#111" stroke-width="2.4"/><polyline points="191.0,195 259.0,195" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="197.0,165 225,160.8 253.0,165" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="225" y="158" font-size="9" font-weight="700" text-anchor="middle" fill="#111" >FWT-501 feed tank (A)</text><polyline points="197,189 84,189 84,156" fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="79.5,165 84,156 88.5,165" fill="#2a6f97"/><polyline points="302,181 258,181" fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="265,176.5 256,181 265,185.5" fill="#2a6f97"/><text x="302" y="170" font-size="9" font-weight="400" text-anchor="end" fill="#111" >cond.</text><text x="302" y="193" font-size="9" font-weight="400" text-anchor="end" fill="#111" >return (A)</text><ellipse cx="218" cy="48" rx="30" ry="24" fill="none" stroke="#b26a00" stroke-width="1.6" stroke-dasharray="3 3"/><rect x="110" y="-78" width="150" height="36" rx="5" fill="#fff3e0" stroke="#111" stroke-width="2"/><text x="185.0" y="-62.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111" >BMS-501 / ESD (A)</text><text x="185.0" y="-50.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111" >burner management + trips</text><polyline points="149,102 158,102 158,-42" fill="none" stroke="#1565c0" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="149,136 158,136 158,102" fill="none" stroke="#1565c0" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="190,-42 190,30" fill="none" stroke="#c62828" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahr)"/><polyline points="110,-60 14,-60 14,96" fill="none" stroke="#c62828" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahr)"/><polygon points="233.0,46.0 224.9,48.9 228.6,56.6 220.9,52.9 218.0,61.0 215.1,52.9 207.4,56.6 211.1,48.9 203.0,46.0 211.1,43.1 207.4,35.4 215.1,39.1 218.0,31.0 220.9,39.1 228.6,35.4 224.9,43.1" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/></g><rect x="590" y="592" width="520" height="123.0" rx="0" fill="#fff" stroke="#b26a00" stroke-width="1.4"/><text x="598" y="607" font-size="10" font-weight="700" text-anchor="start" fill="#b26a00" >Reading the drawing (S2)</text><text x="598" y="618.0" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >• Header or flange break near XV-502: scald and flash steam; the steam supply to B-201, E-301 and</text><text x="608" y="631.5" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >B-401 is lost. Other initiators: low water or overpressure in BL-501.</text><text x="598" y="649.0" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >• Duty context (D): steam about 468 kg/h (390 direct, 77 indirect); boiler heat to steam 306 kW,</text><text x="608" y="662.5" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >fuel input 360 kW at 85 % (A).</text><text x="598" y="680.0" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >• BMS-501 trips fuel XV-501 and closes steam ESDV XV-502 on low water, high pressure or header</text><text x="608" y="693.5" font-size="10" font-weight="400" text-anchor="start" fill="#b26a00" >low-pressure (A).</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >WHY THESE TWO SCENARIOS</text><text x="1145" y="124.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• The source describes no large flammable inventory. Its process-safety</text><text x="1155" y="137.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >exposure sits in the utilities: a refrigeration system for IQF freezing</text><text x="1155" y="151.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >and the cold store, and a steam boiler.</text><text x="1145" y="170.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Refrigerant release: the machinery room concentrates charge, compressors</text><text x="1155" y="184.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >and joints. The outcome depends on the refrigerant, which the source does</text><text x="1155" y="197.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >not give: toxic (for example ammonia), asphyxiant (CO2, halocarbons) or</text><text x="1155" y="211.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >flammable (hydrocarbons). The refrigerant choice is an open question for</text><text x="1155" y="224.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >the licensor, with a hazard study to follow.</text><text x="1145" y="244.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Steam release: saturated steam at an assumed 4 bar(a) scalds at the break.</text><text x="1155" y="257.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Loss of steam also stops blanching and pasteurising, which is a food-</text><text x="1155" y="271.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >safety event too (sheet 5).</text><text x="1145" y="290.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Statutory (S, section 6): boiler approval, factory licence and fire NOC</text><text x="1155" y="304.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >are listed. Nothing in the source gives boiler capacity, fuel or</text><text x="1155" y="317.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >inspection dates.</text><text x="1145" y="337.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• All safeguards are A (assumed): detection, ESD closure, emergency extract,</text><text x="1155" y="350.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >PSVs vented outside. No distance, release rate or frequency is given:</text><text x="1155" y="364.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >those need vendor data.</text><rect x="1135" y="389.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="405.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >OPEN DATA NEEDS, SCENARIOS 1 AND 2</text><text x="1145" y="429.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Refrigerant type, charge, room volume, ventilation rate, detector set</text><text x="1155" y="443.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >points and the refrigeration safety code to apply.</text><text x="1145" y="460.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Boiler capacity, fuel, header pressure and route, valve closing times,</text><text x="1155" y="474.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >inspection and test records.</text><text x="1145" y="491.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: needs the data above.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative unless a number is shown; open data needs named)</text><rect x="20" y="806" width="1100" height="19.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="134" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="324" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="554" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (R / A)</text><text x="884" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >S1 Refrigerant</text><text x="24" y="850.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >release</text><text x="134" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Leak from receiver V-701, compressor</text><text x="134" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >seals, flanges or a relief valve in</text><text x="134" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >MR-701</text><text x="324" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Toxic, asphyxiant or flammable cloud in a</text><text x="324" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >closed room (depends on the refrigerant); cold</text><text x="324" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >burns; loss of IQF freezing and cold store</text><text x="554" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >AT-701 detector (A); ESD-701 closes SV-701 and stops C-701 (A);</text><text x="554" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >emergency extract EF-701 (A); PSV-701 vented outside (A); PSH-701</text><text x="554" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >high-pressure cut-out (A)</text><text x="884" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Refrigerant type and charge; room volume and</text><text x="884" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ventilation rate; detector set points;</text><text x="884" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >refrigeration safety code to apply</text><rect x="20" y="868.0" width="1100" height="42.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="881.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >S2 Boiler / steam</text><text x="24" y="892.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >release</text><text x="134" y="881.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Header or flange failure; low water;</text><text x="134" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >overpressure; loss of feedwater</text><text x="324" y="881.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Scald and flash steam; boiler failure; loss of</text><text x="324" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >steam to blanchers and pasteuriser (a food-</text><text x="324" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >safety event too)</text><text x="554" y="881.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >LSLL-501 low-water trip (A); PT-501; PSV-501, PSV-502 vented to</text><text x="554" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >roof (A); XV-502 steam ESDV (A); XV-501 fuel shut-off (A); boiler</text><text x="554" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >approval (R, section 6)</text><text x="884" y="881.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Boiler capacity, fuel, header pressure and</text><text x="884" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >route; inspection records</text><rect x="20" y="806" width="1100" height="104.5" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

<polygon points="238,55.5 247,60 238,64.5" fill="#6d4c41"/><circle cx="232" cy="34" r="15" fill="#fff" stroke="#111" stroke-width="1.6"/><line x1="217" y1="34" x2="247" y2="34" stroke="#111" stroke-width="1.2"/><text x="232" y="32" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >AT</text><text x="232" y="44" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >601</text><polyline points="232,49 232,60" fill="none" stroke="#111" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="214" y="20" font-size="9" font-weight="400" text-anchor="end" fill="#111" >pH (A)</text><path d="M247.0,56.0 A28.0,11.200000000000001 0 0 1 303.0,56.0 V112.0 A28.0,11.200000000000001 0 0 1 247.0,112.0 Z" fill="#fff" stroke="#111" stroke-width="2.4"/><polyline points="275,36.8 275,103.6" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="262.68,103.6 287.32,103.6" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="275" cy="26.799999999999997" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="275" y="30.299999999999997" font-size="9" font-weight="700" text-anchor="middle">M</text><text x="275" y="139.2" font-size="11" font-weight="700" text-anchor="middle" fill="#111" >R-601</text><text x="275" y="152.2" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111" >aerobic (A)</text><path d="M323.0,52 A22.0,12.32 0 0 1 367.0,52 V112 A22.0,12.32 0 0 1 323.0,112 Z" fill="#fff" stroke="#111" stroke-width="2.4"/><text x="345" y="26" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >CL-601</text><text x="345" y="37" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >clarifier (A)</text><polyline points="303,84 323,84" fill="none" stroke="#6d4c41" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="314,79.5 323,84 314,88.5" fill="#6d4c41"/><polyline points="367,84 426,84" fill="none" stroke="#6d4c41" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="417,79.5 426,84 417,88.5" fill="#6d4c41"/><text x="428" y="98" font-size="9" font-weight="400" text-anchor="end" fill="#111" >treated</text><text x="428" y="109" font-size="9" font-weight="400" text-anchor="end" fill="#111" >consent (A)</text><polyline points="345,124 345,168 290,168" fill="none" stroke="#6d4c41" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="299,163.5 290,168 299,172.5" fill="#6d4c41"/><rect x="236" y="156" width="54" height="24" rx="5" fill="#fff" stroke="#111" stroke-width="2"/><text x="263.0" y="172.0" font-size="10" font-weight="700" text-anchor="middle" fill="#111" >SB-601</text><text x="263" y="192" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >sludge bed (A)</text><text x="8" y="168" font-size="9" font-weight="400" text-anchor="start" fill="#111" >Not sized: needs COD/BOD,</text><text x="8" y="180" font-size="9" font-weight="400" text-anchor="start" fill="#111" >flow peaks, consent limits (S)</text><ellipse cx="60" cy="60" rx="52" ry="28" fill="#ffcc80" opacity=".4" stroke="#b26a00" stroke-dasharray="3 3"/><polygon points="38.0,22.0 30.5,24.7 33.9,31.9 26.7,28.5 24.0,36.0 21.3,28.5 14.1,31.9 17.5,24.7 10.0,22.0 17.5,19.3 14.1,12.1 21.3,15.5 24.0,8.0 26.7,15.5 33.9,12.1 30.5,19.3" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><text x="42" y="26" font-size="10" font-weight="700" text-anchor="start" fill="#c62828" >slug in</text></g><rect x="612" y="480" width="500" height="140.5" rx="0" fill="#fff" stroke="#6d4c41" stroke-width="1.4"/><text x="620" y="495" font-size="10" font-weight="700" text-anchor="start" fill="#6d4c41" >Reading the drawing (S4)</text><text x="620" y="506.0" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >• A slug of high-strength liquid enters the effluent header at the left (star). S-601 and</text><text x="630" y="519.5" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >equalisation TK-601 are the first defence; AT-601 (pH) and LT-601 (level) alarm.</text><text x="620" y="537.0" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >• Normal load (D from A): 15.1 m3/h, COD about 22.6 kg/h (1,503 mg/L).</text><text x="620" y="554.5" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >• Illustration (D): one hour of deaerated pulp (stream 15) sent to drain carries about 252 kg</text><text x="630" y="568.0" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >COD, 11 times a normal hour.</text><text x="620" y="585.5" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >• Real peaks (CIP, spills, changeovers, season start-up) are not modelled. Normal COD = fruit</text><text x="630" y="599.0" font-size="10" font-weight="400" text-anchor="start" fill="#6d4c41" >leach plus the IQF peel/cut stream (BREF Table 8.3); not a design peak.</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >WHY A FOOD-SAFETY CCP IS DRAWN LIKE THIS</text><text x="1145" y="124.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• In a food plant the critical control point is a process-safety-like</text><text x="1155" y="137.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >barrier: if product leaves E-301 and the hold tube below the validated</text><text x="1155" y="151.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >temperature or time, the pack can carry live organisms. TIC-301 and</text><text x="1155" y="164.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >TSL-302 with a flow-diversion valve FDV-301 divert under-processed product</text><text x="1155" y="178.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >to BT-301 for re-heat or rejection (all A).</text><text x="1145" y="197.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• The source lists HACCP / ISO 22000, an in-house lab and batch traceability</text><text x="1155" y="211.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >as the mitigation (section 12, R). It gives no critical limit, hold time</text><text x="1155" y="224.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >or validation: those are open data needs.</text><text x="1145" y="244.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Hot-fill depends on the fill temperature and the cooling tunnel TC-301;</text><text x="1155" y="257.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >aseptic adds sterile cooling by E-302 and a sterile filler AF-301, where</text><text x="1155" y="271.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >loss of sterility is the failure.</text><text x="1145" y="290.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Steam loss (sheet 4, S2) is also an S3 initiator: with no steam, E-301</text><text x="1155" y="304.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >cannot reach 95 or 105 C and FDV-301 must divert all flow.</text><rect x="1135" y="329.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="345.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 4 NUMBERS (D from A, sheet 2)</text><rect x="1135" y="351.5" width="445" height="17" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="1139" y="362.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Item</text><text x="1414" y="362.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Value</text><text x="1139" y="379.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Normal flow to ETP (m3/h)</text><text x="1414" y="379.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >15.1</text><rect x="1135" y="385.5" width="445" height="17" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="396.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Normal COD (kg/h)</text><text x="1414" y="396.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >22.6</text><text x="1139" y="413.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Normal COD (mg/L)</text><text x="1414" y="413.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >1,503</text><rect x="1135" y="419.5" width="445" height="17" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="430.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >One hour of pulp dumped: COD (kg)</text><text x="1414" y="430.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >252</text><text x="1139" y="447.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Ratio to a normal hour</text><text x="1414" y="447.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >11 x</text><rect x="1135" y="351.5" width="445" height="102" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="1135" y="465.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="481.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >OPEN DATA NEEDS, SCENARIOS 3 AND 4</text><text x="1145" y="505.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• S3: critical limit, hold time, F-value, hold-tube design, CIP / SIP</text><text x="1155" y="519.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >procedure, validation by the process authority.</text><text x="1145" y="536.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• S4: COD / BOD and flow variation by crop, pollution-board consent limits,</text><text x="1155" y="550.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >tank volumes, sludge route.</text><text x="1145" y="567.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: needs the data above.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative unless a number is shown; open data needs named)</text><rect x="20" y="806" width="1100" height="19.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="134" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="324" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="554" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (R / A)</text><text x="884" y="819.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >S3 Hot-fill / aseptic</text><text x="24" y="850.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >deviation</text><text x="134" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Steam control or supply fault; hold</text><text x="134" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >tube fouled; excess flow; FDV-301</text><text x="134" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fails to divert; aseptic path</text><text x="134" y="873.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >contaminated</text><text x="324" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Under-processed pulp reaches the pack:</text><text x="324" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >spoilage organisms or pathogens survive;</text><text x="324" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >recall and illness. A food-safety CCP, not a</text><text x="324" y="873.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fire scenario</text><text x="554" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >TIC-301 / TSL-302 with FDV-301 divert (A); hold tube HT-301 (A); QC</text><text x="554" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >lab LAB-801 and batch traceability (R); HACCP plan (R); BT-301 re-</text><text x="554" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >heat or reject (A)</text><text x="884" y="838.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Critical limit, hold time, F-value; hold-tube</text><text x="884" y="850.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >design; validation by the process authority; CIP</text><text x="884" y="861.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >/ SIP procedure</text><rect x="20" y="879.5" width="1100" height="42.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="892.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >S4 Effluent high load</text><text x="134" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Product or pulp dumped to drain; CIP</text><text x="134" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >discharge; season start-up; ETP screen</text><text x="134" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >blinds</text><text x="324" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Biological upset, consent breach, odour;</text><text x="324" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >possible shutdown of washing and blanching</text><text x="554" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S-601 screen (A); equalisation TK-601 with LT-601 and AT-601 pH</text><text x="554" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(A); R-601 / CL-601 (A); ETP is in the source cost list (R);</text><text x="554" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pollution-board consent (R, section 6)</text><text x="884" y="892.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >COD / BOD and flow variation; consent limits;</text><text x="884" y="904.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >tank volumes; sludge route</text><rect x="20" y="806" width="1100" height="116.0" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

71.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >closed</text><text x="1023" y="771.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >-</text><rect x="20" y="612.5" width="1096" height="165" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="22" y="789.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >Fail-safe isolation on loss of power: S1 para 128 (R). Voting, set points and test intervals are A; no SIL verification is claimed.</text><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >MARKS AND SOURCES</text><text x="1145" y="120" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• R = required or recommended by a named free source. A = assumed here. gap = the</text><text x="1155" y="132" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >controlling standard is paywalled or was not obtained (OISD, API 520/521/526,</text><text x="1155" y="144" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >NFPA, IEC 61511, IIAR 2, EN 378, BIS, boiler code).</text><text x="1145" y="161" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• S1 HSE HSG176 (2015): fail-safe remote isolation (para 128), bund 110 % / 25 %</text><text x="1155" y="173" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(para 157). S2 HSE HSG238: separate control and protection. S3 HSE COMAH plant-</text><text x="1155" y="185" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >layout guidance. S5 OSHA 29 CFR 1910.119: relief design basis, ESD, PHA. S6</text><text x="1155" y="197" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Fertilizers Europe ammonia tank guidance. S7 US EPA Region 7 ammonia</text><text x="1155" y="209" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >refrigeration manual (describes IIAR 2). S10 CSB BP-Husky: SIS credited in PHA.</text><text x="1155" y="221" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S11 CSB Kuraray: relief discharge location. S19 SIL/LOPA snippets only (grade</text><text x="1155" y="233" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >C).</text><text x="1145" y="250" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Ammonia is a conditional case only: the source names no refrigerant. Its</text><text x="1155" y="262" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >conditional items are labelled on the rows above.</text><text x="1145" y="279" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Set pressures, boiler MAWP, circuit ratings and the Rev B sizing result are</text><text x="1155" y="291" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >assumptions or indicative figures from the toolkit; none replaces a vendor or</text><text x="1155" y="303" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >code calculation.</text></svg></section><section class="sheet" id="s7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

" >vacuum collapse</text><text x="244" y="585.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >vacuum source fails; vent blocked; condenser</text><text x="244" y="597.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >cooling lost</text><text x="474" y="585.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >air ingress; vessel collapse if vent blocked</text><text x="704" y="585.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >VB-201; design for full vacuum (A)</text><text x="919" y="585.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >confirm design basis and vacuum source</text><text x="24" y="614.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >N9 CIP-901</text><text x="139" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >wrong chemical or</text><text x="139" y="626.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >mixing</text><text x="244" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >acid and chlorine-based liquor mixed; wrong</text><text x="244" y="626.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >hose</text><text x="474" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >toxic gas; burns; product contamination</text><text x="704" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >segregated storage; dedicated connectors</text><text x="704" y="626.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(A); PPE</text><text x="919" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >gap: no free source read; supplier data</text><text x="919" y="626.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >sheets</text><rect x="20" y="631.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="643.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >N10 ETP-601</text><text x="139" y="643.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >high load</text><text x="244" y="643.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pulp dump; peel-water surge; CIP slug</text><text x="474" y="643.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >biological upset; consent breach; odour</text><text x="704" y="643.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S-601; TK-601; LT-601, AT-601</text><text x="919" y="643.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >size from the Rev B load, not 568 mg/L</text><text x="919" y="655.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(sheet 2)</text><rect x="20" y="376.0" width="1100" height="284.5" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >HOW TO READ THIS SHEET</text><text x="1145" y="120" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• SIF targets are assumptions to be replaced by a hazard and risk study (LOPA or</text><text x="1155" y="132" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >equivalent). The free sources read give separation of control and protection</text><text x="1155" y="144" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(S2) and the need to test credited layers (S10); the SIL method text is</text><text x="1155" y="156" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >paywalled.</text><text x="1145" y="173" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Demand rates and failure data are not given: no frequency or SIL claim is made.</text><text x="1145" y="190" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Hazard nodes follow the checklist item 'HAZOP node list and PHA incl. facility</text><text x="1155" y="202" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >siting' (S5). Consequences are qualitative; numbers need the refrigerant, charge</text><text x="1155" y="214" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >and boiler data listed on sheets 3 to 5.</text><text x="1145" y="231" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Nodes N1 and N2 are refrigerant-dependent. If ammonia is chosen, treat as toxic:</text><text x="1155" y="243" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >SIF-1 target and room ventilation are then reviewed (conditional, S6 and S7 as</text><text x="1155" y="255" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >reported).</text></svg></section><section class="sheet" id="s8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

</defs><rect width="1600" height="1130" fill="#fff"/><rect x="8" y="8" width="1584" height="1114" rx="0" fill="none" stroke="#111" stroke-width="2.2"/><rect x="8" y="8" width="1584" height="66" rx="0" fill="#0d1b3e" stroke="none" stroke-width="1.2"/><text x="24" y="38" font-size="13" font-weight="700" text-anchor="start" fill="#9fb4ff" >VertiStrat Solutions LLP</text><text x="24" y="62" font-size="21" font-weight="700" text-anchor="start" fill="#fff" >SAFETY DESIGN BASIS (Rev B) 3 of 3: detection, mitigation, layout, inherently safer design</text><text x="1576" y="38" font-size="13" font-weight="400" text-anchor="end" fill="#fff" >Sheet 8 of 8  |  Drawing VS-FV-008  |  Rev B</text><text x="1576" y="62" font-size="13" font-weight="700" text-anchor="end" fill="#ffcc80" >CONCEPTUAL P&amp;ID - SCREENING BASIS - NOT FOR CONSTRUCTION</text><rect x="1135" y="960" width="445" height="140" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1143" y="981" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Project</text><text x="1205" y="981" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Fruit and vegetable processing, 10,000 t/yr raw</text><polyline points="1135,992 1580,992" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1006" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Sheet</text><text x="1205" y="1006" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Safety design basis, detection and ISD</text><polyline points="1135,1017 1580,1017" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1031" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Basis</text><text x="1205" y="1031" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SAFETY_FEATURES_CHECKLIST.md; marks R / A / gap</text><polyline points="1135,1042 1580,1042" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1056" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Prepared</text><text x="1205" y="1056" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Claude Sonnet 5.5 for owner review, 11 Nov 2026</text><polyline points="1135,1067 1580,1067" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1081" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Status</text><text x="1205" y="1081" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Draft B. Screening aid, not certified design</text><rect x="20" y="84" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DETECTION AND MITIGATION</text><rect x="20" y="106" width="1100" height="17.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="118.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Item</text><text x="204" y="118.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Basis / logic</text><text x="764" y="118.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Mark</text><text x="914" y="118.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Source or gap</text><text x="24" y="135.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Gas detection, MR-701</text><text x="204" y="135.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >two detectors (AT-701, AT-702) with alarm and high-high executive action (SIF-1). Height by gas density: ammonia</text><text x="204" y="147.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >vapour is lighter than air when warm, halocarbons and CO2 are heavier; so the refrigerant sets the placement.</text><text x="764" y="135.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; R conditional (ammonia)</text><text x="914" y="135.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S7 as reported (dual detectors); IIAR 2 /</text><text x="914" y="147.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >EN 378 gap</text><rect x="20" y="152.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="164.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Machinery-room ventilation</text><text x="204" y="164.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >continuous ventilation plus emergency extract EF-701 started by detection; discharge to a safe outdoor location away</text><text x="204" y="176.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >from air intakes and people. Air-change rate: not set.</text><text x="764" y="164.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; R for discharge location</text><text x="914" y="164.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S11 (discharge is a design item); rate:</text><text x="914" y="176.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >gap (IIAR 2, EN 378)</text><text x="24" y="193.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Boiler house</text><text x="204" y="193.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fuel is not in the source. If gas-fired: gas proving, leak test and detection per burner standard; flame failure</text><text x="204" y="205.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >trips XV-501 (SIF-5).</text><text x="764" y="193.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; gap</text><text x="914" y="193.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >burner standard and HSE PM5 (404) not</text><text x="914" y="205.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >obtained</text><rect x="20" y="210.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="222.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Isolation of inventories</text><text x="204" y="222.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-501 (fuel), XV-502 (steam), SV-701 (refrigerant liquid): remotely operated, fail closed on loss of power. No</text><text x="204" y="234.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >large flammable inventory exists on this plant.</text><text x="764" y="222.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R</text><text x="914" y="222.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S1 para 128</text><text x="24" y="251.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Refrigerant relief and venting</text><text x="204" y="251.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PSV-401, 402, 701 into RH-701, vent outdoors. Ammonia (conditional): scrubber or flare for relief and vents; dual</text><text x="204" y="263.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PRVs with 3-way valve.</text><text x="764" y="251.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; R conditional</text><text x="914" y="251.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S6, S7 as reported; IIAR 2 gap</text><rect x="20" y="268.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="280.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Bund / impoundment</text><text x="204" y="280.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >no bulk flammable liquid: none drawn. Boiler fuel oil, caustic, acid: bund 110 % of the largest vessel or 25 % of</text><text x="204" y="292.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >total capacity. Rule is for flammable liquids; used for CIP chemicals by analogy.</text><text x="764" y="280.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R (fuel); A (CIP)</text><text x="914" y="280.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S1 HSG176 para 157</text><text x="24" y="309.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Layout and distances</text><text x="204" y="309.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >MR-701 and BH-501 apart from occupied areas and exits; consider domino escalation and occupied buildings. Spacing</text><text x="204" y="321.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >table in S1 applies only to flammable-liquid tanks (1 m for up to 1 m3, to 15 m above 250 m3).</text><text x="764" y="309.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R (principle); A (positions)</text><text x="914" y="309.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S1 Table 1; S3</text><rect x="20" y="326.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="338.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Fire water and foam</text><text x="204" y="338.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fire NOC is named in the source (section 6): its requirements set fire water; foam not needed for the process fluids</text><text x="204" y="350.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >drawn (A). No free source read for food-plant fire water.</text><text x="764" y="338.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R (NOC); gap</text><text x="914" y="338.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >NOC requirements to obtain; NFPA 30 / OISD</text><text x="914" y="350.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >not obtained</text><text x="24" y="367.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hot-fill / aseptic sterility CCP</text><text x="204" y="367.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >calibrated temperature sensor and recorder after HT-301, flow diversion FDV-301, hold time from the validated</text><text x="204" y="379.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >schedule, batch hold until LAB-801 release. Detection of loss of sterility is by monitoring, not by a gas detector.</text><text x="764" y="367.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R (HACCP, lab)</text><text x="914" y="367.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >source sec. 12; limits: gap (process</text><text x="914" y="379.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >authority)</text><rect x="20" y="384.5" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="396.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >CIP chemical handling</text><text x="204" y="396.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >caustic and acid in separate bunded storage; dedicated connectors; no mixing of acid with chlorine-based liquor;</text><text x="204" y="408.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >eyewash and shower at the dosing point; dosing pump leak containment.</text><text x="764" y="396.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; gap</text><text x="914" y="396.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >no free source read; supplier safety data</text><text x="914" y="408.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >sheets</text><text x="24" y="425.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Inerting</text><text x="204" y="425.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >not applicable: no flammable process atmosphere (fruit, water, steam). Machinery-room atmosphere is controlled by</text><text x="204" y="437.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ventilation.</text><text x="764" y="425.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A</text><text x="914" y="425.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >-</text><rect x="20" y="106" width="1100" height="336.5" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="20" y="452.5" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="468.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >INHERENTLY SAFER DESIGN OPTIONS (4 to 6, specific to this process)</text><rect x="20" y="474.5" width="1100" height="17.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="486.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Option</text><text x="254" y="486.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Idea</text><text x="904" y="486.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Mark / source</text><text x="24" y="504.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >1 Substitute the refrigerant, or use an</text><text x="24" y="515.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >indirect loop</text><text x="254" y="504.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >choose a refrigerant with lower toxicity or flammability, or confine a small primary charge to MR-701 and send chilled brine or glycol</text><text x="254" y="515.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >to F-401 and CS-401: smaller inventory near people.</text><text x="904" y="504.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A (no free source for the choice); S7</text><text x="904" y="515.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >describes ammonia practice</text><rect x="20" y="521.0" width="1100" height="29.0" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="533.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >2 Reduce steam pressure and energy</text><text x="254" y="533.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >blanch and pasteurise at the lowest steam pressure that meets the duty (4 bar a drawn; BREF Table 8.6 tests at 7 bar); belt blancher</text><text x="254" y="544.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >with water cooler recovers heat (0.09 t/t against 0.16).</text><text x="904" y="533.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S BREF Tables 8.6, 8.7 (read); A for</text><text x="904" y="544.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pressure</text><text x="24" y="562.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >3 Moderate the boiler rating</text><text x="254" y="562.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >boiler MAWP only above what the header needs (6.0 against 5.0 barg here); smaller steam inventory in the header.</text><text x="904" y="562.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="567.5" width="1100" height="17.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="579.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >4 Separate the CCP from control</text><text x="254" y="579.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >give TSL-302 / FDV-301 their own sensor and valve, not shared with TIC-301 / TCV-301.</text><text x="904" y="579.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R: S2 (separate protection and control)</text><text x="24" y="597.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >5 Reduce inventory at the receiver</text><text x="254" y="597.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >smallest receiver that supports pump-down; machinery room on an outside wall with its discharge away from intakes.</text><text x="904" y="597.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A; S11 for discharge</text><rect x="20" y="602.5" width="1100" height="17.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="614.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >6 Reduce hazardous CIP chemicals</text><text x="254" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >lowest effective caustic and acid strength; avoid chlorine-based sanitiser with acid cleaners on the same skid.</text><text x="904" y="614.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="474.5" width="1100" height="145.5" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >STANDARDS TO OBTAIN (gaps behind the rows)</text><text x="1145" y="120" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• IIAR 2 and EN 378 (refrigeration machinery rooms, detectors, ventilation,</text><text x="1155" y="132" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >relief); IEC 61511 and a LOPA text (SIL method); API 520 / 521 / 526 and ASME</text><text x="1155" y="144" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >VIII (relief sizing); boiler code and burner standard (PM5 returned 404); NFPA</text><text x="1155" y="156" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >30 / 58 and OISD standards (paywalled, INR 10,500 each plus GST) if fuel storage</text><text x="1155" y="168" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >is added; PESO rules; FSSAI and process-authority limits for the CCP.</text><text x="1145" y="185" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Free sources read are S1 to S3, S5 to S7, S10, S11. Nothing paywalled is</text><text x="1155" y="197" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >reproduced here.</text><text x="1145" y="214" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >• Rev B does not change the process-safety character of the set: no large</text><text x="1155" y="226" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >flammable inventory; the hazards are refrigerant release, steam and boiler, and</text><text x="1155" y="238" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >loss of sterility.</text></svg></section></body></html>
