rt fuel (0.37</text><text x="1151" y="212.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >vol % CH4 limit). Sources and the Rev A to Rev B box: sheets 2 and 3.</text><text x="1141" y="228.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Everything else (two 50 % digesters, mesophilic, double-membrane</text><text x="1151" y="240.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >holders, membrane upgrading, 250 barg cascade) is A; none is a</text><text x="1151" y="253.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >licensor or vendor selection.</text><text x="1141" y="268.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Stream diamonds 1 to 17 are the columns of the HMB on sheet 2. Line</text><text x="1151" y="281.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >numbers are service-seq-size(mm)-class, class A pending specification.</text><text x="1141" y="296.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Colours: brown slurry, green biogas, purple CBG, grey off-gas, red</text><text x="1151" y="309.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >dashed ESD, blue dashed signal, amber dashed utility.</text><rect x="1135" y="326.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="342.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SAFEGUARDS SHOWN (A unless marked R; basis on sheets 6 and 7)</text><text x="1141" y="364.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Relief devices tagged on the drawing: PRV-201A/B (pressure and vacuum)</text><text x="1151" y="377.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >with FA-201A/B, PSV-301, 302, 401, 402, 501, 601, TPRD-601 per tube,</text><text x="1151" y="389.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PVRV-501/502, VT-101, OF-201A/B. Destinations: FH = flare header to</text><text x="1151" y="402.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >FL-901, VS = safe vent stack, both A.</text><text x="1141" y="417.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Holder: PIC-201 opens PV-201 to flare before the PRV lifts; PSLL-201</text><text x="1151" y="430.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >stops K-301 (vacuum); PSHH-201 stops feed. XV-201 isolates the</text><text x="1151" y="442.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >holders; XV-101A/B stop slurry feed on LSHH-201 or ESD.</text><text x="1141" y="458.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Gas detection AT-201 (CH4 high and low level, H2S; S12), AT-202 H2S at</text><text x="1151" y="470.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >the feed area, AT-402 and UV/IR-401 in the compressor house, AT-601</text><text x="1151" y="483.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >and UV/IR-601 at the filling bay feed ESD-101. Matrix on sheet 6.</text><text x="1141" y="498.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• K-202 discharge PSV-501 and PSHH-501; XV-501 and XV-601 close the</text><text x="1151" y="511.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >cascade and fill on ESD. Off-gas to OX-401 through FA-401.</text><rect x="1135" y="528.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="544.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >LEGEND</text><polyline points="1146,566.5 1180,566.5" fill="none" stroke="#5d4037" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="1186" y="570.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >slurry / liquid</text><polyline points="1361,566.5 1395,566.5" fill="  font-weight="700" text-anchor="middle" fill="#2e7d32" >AT-201 + ESD</text><rect x="40" y="130" width="100" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="90.0" y="141" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >FL-901 burns gas</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (consequence numbers only where a documented formula or toolkit function was run)</text><rect x="20" y="806" width="1100" height="19" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="174" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="394" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="644" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown</text><text x="914" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838.0" font-size="10" font-weight="700" text-anchor="start" fill="#111" >1 Holder / digester gas</text><text x="24" y="850.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >release</text><text x="174" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Membrane tear, fixing failure,</text><text x="174" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hose/clamp failure on GH-201, fire,</text><text x="174" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >vehicle impact (A)</text><text x="394" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Flammable and toxic (H2S) cloud near the</text><text x="394" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >digesters; ignition gives flash fire;</text><text x="394" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >unignited H2S exposure</text><text x="644" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >AT-201 CH4/H2S detection; ESD-101 closes XV-201</text><text x="644" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >and stops K-301; PIC-201/PV-201 limit pressure;</text><text x="644" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PRV vent to safe place</text><text x="914" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Membrane material and tear mode; H2S</text><text x="914" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >limit values and dispersion not run;</text><text x="914" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >layout, wind, ignition sources</text><polyline points="20,877.5 1120,877.5" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="892.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >2 Over-pressure / vacuum</text><text x="174" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Blower trip or XV-201 closed with feed</text><text x="174" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >running (over-pressure); K-301 over-draw</text><text x="174" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >or digestate draw-off (vacuum)</text><text x="394" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Holder over-inflation, membrane burst, vent</text><text x="394" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >release; vacuum draws air and makes a</text><text x="394" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >flammable mixture</text><text x="644" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PIC-201 to PV-201 and flare; PRV-201A/B</text><text x="644" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >pressure/vacuum relief; LSHH-201 stops feed; low-</text><text x="644" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >pressure trip of K-301 (A)</text><text x="914" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PRV capacity, set and vacuum limits;</text><text x="914" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >holder design pressure; flammable</text><text x="914" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >range of the CH4/CO2/air mixture</text><polyline points="20,932.0 1120,932.0" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="22" y="938.0" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Rates: process_safety.release.gas_release_kg_s (orifice flow, Cd 0.85 A25, k 1.3 A17), M of raw biogas 27.1 kg/kmol (D). Inventories = production rate x hours (D).</text><text x="22" y="952.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Not quantified: toxic and flammable cloud extent, membrane failure frequency, H2S exposure limits. Needs: holder datasheet, wind and layout, licensed dispersion model.</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 1: HOLDER RELEASE</text><text x="1141" y="122.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Release point: tear or failed fixing in the outer or inner membrane of</text><text x="1151" y="135.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >GH-201B; gas escapes at holder pressure, only a few mbar(g), so the</text><text x="1151" y="149.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >release is low momentum and the cloud is driven by wind and buoyancy.</text><text x="1151" y="162.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Wet raw biogas has a molar mass of about 27.1 kg/kmol (D), close to</text><text x="1151" y="176.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >air, so it may not rise: dispersion not assessed.</text><text x="1141" y="194.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• The rate above (0.17 kg/s) is for a 100 mm hole at 3 mbar(g). It is a</text><text x="1151" y="208.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >screening number, not a tear model.</text><text x="1141" y="226.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• H2S is toxic as well as flammable. No toxic limit is quoted here (not</text><text x="1151" y="240.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >in the source files).</text><text x="1141" y="258.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Actions: detectors alarm, ESD closes XV-201 to keep the plant gas out,</text><text x="1151" y="272.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >K-301 stops, PV-201 and the flare take the pressure, operators isolate</text><text x="1151" y="285.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >feed.</text><rect x="1135" y="308.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="324.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 2: OVERPRESSURE / VACUUM</text><text x="1141" y="346.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Normal gas generation is 0.322 kg/s wet biogas (stream 5). If the</text><text x="1151" y="359.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >offtake is blocked the headspace fills at that rate until the flare</text><text x="1151" y="373.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >valve or PRV passes it: this is the relief basis (D), not a sized</text><text x="1151" y="386.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >valve.</text><text x="1141" y="405.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Holder volume would take the first minutes; after that the membrane or</text><text x="1151" y="418.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >PRV is the last safeguard. Over-inflation can burst the outer</text><text x="1151" y="432.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >membrane.</text><text x="1141" y="450.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Vacuum case: air entering the headspace can pass the flammable range</text><text x="1151" y="464.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >as it mixes with biogas. A low-pressure trip on K-301 and a vacuum</text><text x="1151" y="477.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >breaker are the usual first barriers (A).</text><text x="1141" y="496.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Digester structural pressure/vacuum limits are not in the source</text><text x="1151" y="509.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >files.</text><rect x="1141" y="532.0" width="100" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="1191.0" y="543.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >green = safeguard acts</text><text x="1141" y="562.0" font-size="10" font-weight="400" text-anchor="start" fill="#666" >green cloud = release; star = release point; amber = scenario 2</text></svg></section><section class="sheet" id="s5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

5.6 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><path d="M999.5,436.1 Q993.8,415.4 1004.5,390.0 Q1015.8,415.2 1010.5,435.9 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><path d="M1024.5,435.8 Q1019.9,414.8 1032.0,390.0 Q1041.9,415.8 1035.5,436.2 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><path d="M1044.5,435.5 Q1040.8,414.4 1054.0,390.2 Q1062.8,416.3 1055.5,436.5 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><polygon points="1020.0,388.0 1014.1,390.1 1016.8,395.8 1011.1,393.1 1009.0,399.0 1006.9,393.1 1001.2,395.8 1003.9,390.1 998.0,388.0 1003.9,385.9 1001.2,380.2 1006.9,382.9 1009.0,377.0 1011.1,382.9 1016.8,380.2 1014.1,385.9" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><text x="945" y="400" font-size="22" font-weight="700" text-anchor="middle" fill="#c62828" >4</text><rect x="530" y="545" width="400" height="76.5" rx="0" fill="#fff" stroke="#c62828" stroke-width="1.5"/><text x="537" y="559.0" font-size="10" font-weight="700" text-anchor="start" fill="#c62828" >4  Fire at cascade bank or compressor house</text><text x="537" y="571.5" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >Fire (pool, jet from scenario 3, or vehicle) heats CAS-601 tubes</text><text x="537" y="584.0" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >and K-202. Gas tubes burst when hot steel loses strength</text><text x="537" y="596.5" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >if thermal relief or isolation fails (gas burst, not BLEVE).</text><text x="537" y="609.0" font-size="10" font-weight="400" text-anchor="start" fill="#c62828" >Heat flux and radius: not quantified (needs layout and PRD data)</text><rect x="870" y="318" width="112" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="926.0" y="329" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >ESD: XV-501/601 close</text><rect x="990" y="505" width="100" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="1040.0" y="516" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >UV/IR + AT-601</text><rect x="972" y="226" width="58" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="1001.0" y="237" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >PSHH-501</text><rect x="896" y="343" width="56" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="924.0" y="354" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >TPRD (A)</text><rect x="870" y="466" width="62" height="15" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="901.0" y="477" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >breakaway</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (consequence numbers only where a documented formula or toolkit function was run)</text><rect x="20" y="806" width="1100" height="19" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="174" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="394" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="644" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown</text><text x="914" y="819" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838.0" font-size="10" font-weight="700" text-anchor="start" fill="#111" >3 HP CBG release</text><text x="174" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Fitting, hose or tube leak at K-202</text><text x="174" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >discharge, dryer or fill hose; hose</text><text x="174" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >pull-away from a departing trailer (A)</text><text x="394" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Choked jet of flammable gas at 250 barg; jet</text><text x="394" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >fire if ignited; delayed ignition in the</text><text x="394" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >compressor enclosure</text><text x="644" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >AT-601 and UV/IR to ESD-101; XV-601/XV-501 close;</text><text x="644" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hose breakaway; PSHH-501 trips K-202; PSV-501 on</text><text x="644" y="863.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >the HP line</text><text x="914" y="838.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Hole size distribution; compressor</text><text x="914" y="850.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >house ventilation; ignition sources</text><polyline points="20,877.5 1120,877.5" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="892.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >4 Fire at cascade or</text><text x="24" y="905.0" font-size="10" font-weight="700" text-anchor="start" fill="#111" >compressor</text><text x="174" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Leak fire, external fire, vehicle fire</text><text x="174" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >at the filling bay, fire in the</text><text x="174" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >compressor house (A)</text><text x="394" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Radiant heat on cascade tubes and K-202;</text><text x="394" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >thermal burst of tubes; domino to adjacent</text><text x="394" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >trailers</text><text x="644" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >UV/IR detection; ESD closes fill and storage;</text><text x="644" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >TPRD on tubes (A); passive/active fire protection</text><text x="644" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >not defined; separation per PESO licence</text><text x="644" y="930.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >(conditions not in source)</text><text x="914" y="892.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Layout and separation distances; tube</text><text x="914" y="905.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PRD data; fire-water or deluge basis;</text><text x="914" y="917.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PESO licence conditions</text><polyline points="20,944.5 1120,944.5" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="22" y="950.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Rate: process_safety.release.gas_release_kg_s at 251.0 bar abs, 313 K, M 17.16 kg/kmol, k 1.3, Cd 0.85; ideal rate 2.87 kg/s x real-gas flux ratio 1.238 (CoolProp, frozen) = 3.55; inventory</text><text x="22" y="963.0" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Z 0.8776 (S, CoolProp).</text><text x="22" y="977.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >Not quantified: jet flame length, radiation, burst energy, probabilities. Needs: toolkit jet-fire run on the real hole size, vendor cascade data, layout.</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 3: HIGH-PRESSURE RELEASE</text><text x="1141" y="122.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• CBG at 250 barg is the highest-energy inventory on the site. A 10 mm</text><text x="1151" y="135.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >hole gives about 3.55 kg/s (choked flow, formula in toolkit</text><text x="1151" y="149.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >release.py). The compressor and cascade supply side keeps feeding</text><text x="1151" y="162.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >until K-202 stops and XV-501/XV-601 close.</text><text x="1141" y="181.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Cascade inventory (566 kg) is 1.4 h of plant output; it is the stored</text><text x="1151" y="194.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >energy for scenario 4.</text><text x="1141" y="213.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Ignited: jet fire on neighbouring tubes, hoses, trailers. Unignited in</text><text x="1151" y="226.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >the enclosure: explosion risk; ventilation and gas detection matter.</text><text x="1141" y="245.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Quantities marked A: hole, cascade size. Replace with vendor data.</text><rect x="1135" y="267.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="283.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO 4: FIRE AT CASCADE OR COMPRESSOR</text><text x="1141" y="305.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Compressed gas cylinders are protected by thermally activated</text><text x="1151" y="319.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >pressure-relief devices (TPRD, A); where they are missing or blocked</text><text x="1151" y="332.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >from the flame, tubes can rupture. No rule or distance is quoted: PESO</text><text x="1151" y="346.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >licence conditions are named in DPR Section 6 but not in the source</text><text x="1151" y="359.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >files.</text><text x="1141" y="378.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Safeguards drawn: flame and gas detection, ESD of fill and storage</text><text x="1151" y="391.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >valves, TPRD (A). Active fire protection is not defined.</text><text x="1141" y="410.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Biogas upstream (holders, 4 h buffer) is not near the cascade; the</text><text x="1151" y="423.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >flare and holder isolation limit escalation toward the digesters.</text><text x="1141" y="442.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >• Domino with the oxidiser and flare is a layout question: not assessed.</text><text x="1141" y="472.5" font-size="10" font-weight="400" text-anchor="start" fill="#666" >star = release point; flames = fire; green tags = safeguards that act</text></svg></section><section class="sheet" id="s6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

ute / eliminate: avoid air-injection desulphurisation (S12 Table 3 gives zone 0 around it); choose a media or biological type with no air in the gas path.</text><text x="26" y="724.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >[A] Simplify: size R-301 and the blower so shut-off pressure is below vessel design and no PSV is needed; fewer relief points to flare.</text><text x="26" y="749.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >[S] Moderate: lean off-gas (below 1 vol % CH4) goes to an RTO at 0.37 vol % limit, so no support-fuel gas line is needed.</text><text x="26" y="773.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >[A] Limit hose and tube hazards: breakaway coupling, TPRD per tube, filling bay at the site edge (distances need PESO text).</text></svg></section></body></html>
