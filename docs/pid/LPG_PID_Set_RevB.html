="664" width="520" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="680" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >NOTES</text><rect x="20" y="686" width="520" height="418" rx="0" fill="#fff" stroke="#889" stroke-width="1"/><text x="30" y="706.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >1. Conceptual P&amp;ID for a screening study. The source files describe a calculation</text><text x="30" y="719.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >chain, not a plant, so no real vessel, layout or line data exist. Vessels V1 to V5</text><text x="30" y="733.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >are an assumed sample set (A1).</text><text x="30" y="751.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >2. Labels: S sourced, D derived, A assumed here, R required or recommended by a</text><text x="30" y="765.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >named free source, gap = controlling standard not obtained. Tags marked (R) follow</text><text x="30" y="778.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >slide 10 of the summary; (A) are assumed to complete the drawing.</text><text x="30" y="797.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >3. Reference vessel is V3, the 105 m3 bullet. Hole, line, fire and BLEVE numbers are</text><text x="30" y="810.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >workbook values, not new calculations, except where marked D.</text><text x="30" y="829.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >4. Rev B: relief areas now at Z = 1.0 (Rev A used 0.673); Purple Book ignition and</text><text x="30" y="842.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >full-bore rupture added to sheet 4; BLEVE chain corrected on sheet 6; TSV-102 and</text><text x="30" y="856.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >more detection added; sheets 7 to 9 are the safety design basis.</text><text x="30" y="874.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >5. No heat and material balance: storage and loss-of-containment set, no process</text><text x="30" y="888.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >streams. Closure checks are on sheet 2.</text><text x="30" y="906.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >6. Distances on the strips are to scale; the P&amp;ID area is not. Do not use any</text><text x="30" y="920.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >distance, area or rate here for siting or design; run a validated tool (Phast /</text><text x="30" y="933.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Safeti).</text><text x="30" y="952.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >7. SIL values are assumed targets (A), not verified. Standards behind a paywall or</text><text x="30" y="965.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >registration (API 520/521/526/2510, NFPA 58, OISD-144/118, IEC 61511) were not read.</text><rect x="560" y="84" width="540" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="568" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >EQUIPMENT AND INSTRUMENT LIST</text><rect x="560" y="106" width="540" height="19" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="564" y="119" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Tag</text><text x="674" y="119" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Description</text><text x="1024" y="119" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Basis</text><text x="564" y="138" font-size="10.5" font-weight="400" text- or="start" fill="#111" >Normal operation (propane case)</text><text x="44" y="668.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Saturated liquid 12 bar(a), 307.5 K; 85 % level.</text><text x="44" y="681.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Fill via XV-101; supply via XV-102, XV-103.</text><text x="44" y="693.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >PSV closed. Gas and flame detectors armed.</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >OPERATION AND SAFEGUARDS</text><text x="1145" y="124" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Normal: V-101 holds saturated LPG at its vapour pressure. Fill</text><text x="1155" y="139" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >enters at the top nozzle N1, supply leaves at the bottom nozzle N2</text><text x="1155" y="154" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >to the 6 inch user line.</text><text x="1145" y="176" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Level: LT-101 gives the operating level and alarms. LSHH-101 is</text><text x="1155" y="191" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >independent and trips XV-101 so the vessel cannot be overfilled</text><text x="1155" y="206" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >(R). A 15 C fill of 85 % grows to 96 % at 50 C and 97 % at 53 C,</text><text x="1155" y="221" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >where vapour pressure reaches the PSV set (D, CoolProp).</text><text x="1145" y="243" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Pressure: PT-101 alarms high (SIF-4). PSV-101 (set 1,724 kPag</text><text x="1155" y="258" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >propane, 690 kPag n-butane, assumed) is sized for fire only.</text><text x="1155" y="273" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >Blocked-in liquid on L-102 now has TSV-102 (A, not sized). Full</text><text x="1155" y="288" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >list on sheet 7.</text><text x="1145" y="310" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Detection: three gas detectors (A, 2oo3) and a UV/IR flame</text><text x="1155" y="325" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >detector feed ESD-101. On confirmed gas or flame, or HS-101, the</text><text x="1155" y="340" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >logic closes XV-101, XV-102 and XV-103 (R). Matrix on sheet 8.</text><text x="1145" y="362" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Fire protection: jet-rated PFP on shell, supports and vapour space</text><text x="1155" y="377" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >(R). Water spray and FM-101 are pool-rated (4 to 10 L/min/m2) and</text><text x="1155" y="392" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >not relied on for jet fire.</text><text x="1145" y="414" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >• Layout: keep the vessel and supports beyond the 19 m jet reach of</text><text x="1155" y="429" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >a 25 mm leak from other equipment and boundaries (R). Table</text><text x="1155" y="444" font-size="11.5" font-weight="400" text-anchor="start" fill="#111" >spacing is not a major-incident distance.</text><rect x="1135" y="600" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x ont-weight="400" text-anchor="start" fill="#111" >16.1</text><text x="1504" y="138" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >-8.8 %</text><rect x="1135" y="144" width="445" height="19" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="157" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >AA 3029 propane</text><text x="1304" y="157" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >15.39</text><text x="1414" y="157" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >18.0</text><text x="1504" y="157" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >-14.5 %</text><text x="1139" y="176" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >JIVE 8051 butane</text><text x="1304" y="176" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >42.32</text><text x="1414" y="176" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >6.86</text><text x="1504" y="176" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >+517 %</text><rect x="1135" y="106" width="445" height="76" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="1141" y="198.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >HEM with friction and flashing, no slip, roughness 1.5 micron,</text><text x="1141" y="211.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >entrance K 0.5, fittings K = 0 unless given (A13). It under-predicts</text><text x="1141" y="225.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >AA by 8 to 14 % and cannot predict JIVE without the lost pressure. No</text><text x="1141" y="238.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >release rate is quoted here: line length, fittings and break location</text><text x="1141" y="252.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >are not defined.</text><rect x="1135" y="273.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="289.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >ISOLATION AND TRAPPED INVENTORY (D)</text><rect x="1135" y="295.5" width="445" height="19" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="1139" y="308.5" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Item</text><text x="1404" y="308.5" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >Value</text><text x="1139" y="327.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Vessel inventory, 85 % (workbook)</text><text x="1404" y="327.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >45,490 kg</text><rect x="1135" y="333.5" width="445" height="19" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="346.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >L-102 volume, 200 m x 150 mm (A14)</text><text x="1404" y="346.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >3.53 m3</text><text x="1139" y="365.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Propane in L-102 if liquid-full, 307.5 K</text><text x="1404" y="365.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >1,687 kg</text><rect x="1135" y="371.5" width="445" height="19" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="1139" y="384.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >Vessel / line inventory</text><text x="1404" y="384.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >27 to 1</text><text x="1139" y="403.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >XV-102 closing time</text><text x="1404" y="403.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#111" >not given (gap)</text><rect x="1135" y="295.5" width="445" height="114" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="1141" y="423.5" font-size="10.5" font-weight="400" text-anchor="start" fill="#666" >XV-102 at the nozzle is what separates the 45 t vessel from a 1.7 t</text><text x="1141" y="437.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#666" >line. It does nothing for a hole upstream of it (sheet 3).</text><rect x="1135" y="458.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="474.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >WHAT THE SCENARIO IS ABOUT</text><text x="1141" y="496.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• A guillotine or large leak on the supply line empties the line,</text><text x="1151" y="510.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >then draws on the vessel until XV-102 closes. Closing time sets</text><text x="1151" y="523.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >the extra release; the source files give none.</text><text x="1141" y="541.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• Unlike sheet 3, the line is the restriction, so the rate is lower</text><text x="1151" y="554.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >and falls with pressure along the pipe. Jet length uses DNV-Cook</text><text x="1151" y="568.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >(default); a horizontal jet reaches further than the vertical flux</text><text x="1151" y="581.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >map (A3).</text><text x="1141" y="599.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• Not drawn in the source files: excess-flow valve, pump, flow</text><text x="1151" y="612.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >meter. Thermal relief of the trapped liquid is added as TSV-102</text><text x="1151" y="626.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >(A) and discussed on sheet 7.</text><rect x="1135" y="649.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="665.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DESIGN POINTS FROM THE SUMMARY (R)</text><text x="1141" y="687.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• Remote, fire-safe emergency isolation valves close to the vessel</text><text x="1151" y="701.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >(XV-102).</text><text x="1141" y="717.5" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• Fire and gas detection tied to ESD-101.</text><text x="1141" y="734.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#111" >• Use the measured pressure at the break, not the vessel pressure.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >FREQUENCY BASIS, 200 m OF 150 mm PIPE: LEAK AND FULL-BORE RUPTURE ON TWO IGNITION BASES (propane | n-butane)</text><rect x="20" y="806" width="1100" height="30.0" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="818.5" font-size="9.8" font-weight="700" text-anchor="start" fill="#111" >Basis</text><text x="524" y="818.5" font-size="9.8" font-weight="700" text-anchor="start" fill="#111" >Event frequency (/yr)</text><text x="644" y="818.5" font-size="9.8" font-weight="700" text-anchor="start" fill="#111" >P(ignition) prop | but</text><text x="794" y="818.5" font-size="9.8" font-weight="700" text-anchor="start" fill="#111" >Jet-fire frequency propane</text><text x="794" y="830.0" font-size="9.8" font-weight="700" text-anchor="start" fill="#111" >(/yr)</text><text x="944" y="818.5" font-size="9.8" font-weight="70 troke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="317,130 317,326.00000000000006" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="379,130 379,326.00000000000006" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="441,130 441,326.00000000000006" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="521,130 521,326.00000000000006" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="583,130 583,326.00000000000006" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><text x="22" y="340.00000000000006" font-size="9.8" font-weight="400" text-anchor="start" fill="#666" >Fail position: XV-101/102/103 close on loss of signal or power (R: remotely operated valves should stay operational or</text><text x="22" y="352.00000000000006" font-size="9.8" font-weight="400" text-anchor="start" fill="#666" >fail safe on power loss, HSG176 para 128, S1). Gas voting 2oo3 and the alarm levels are A (company practice); fire-</text><text x="22" y="364.00000000000006" font-size="9.8" font-weight="400" text-anchor="start" fill="#666" >water start is manual (A). Closing times are not given in the source files (gap).</text><rect x="800" y="108" width="780" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="808" y="124" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DETECTION AND ISOLATION LOGIC</text><text x="806" y="146.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Gas detectors sit low: propane vapour is 1.52 and n-butane 2.01 times air (D, M / 28.96), so it collects at grade, in the drain area and in</text><text x="816" y="158.3" font-size="10" font-weight="400" text-anchor="start" fill="#111" >low points (A). AT-101A/B at the two ends, AT-101C at the drain and low point.</text><text x="806" y="174.6" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Coverage is geographic (ISA TR84.00.07 style, process_safety.fg_mapping): detector radius, voting zones and target coverage are inputs from</text><text x="816" y="186.9" font-size="10" font-weight="400" text-anchor="start" fill="#111" >company practice. Not mapped here: gap. HSE: detection with alarm and executive action (S3 layout, S4, S8).</text><text x="806" y="203.2" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Flame detection BE-101 needs line of sight to the shell, valve cluster and drain; its field of view and range are vendor data (gap).</text><text x="806" y="219.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Large inventory is isolated by XV-102 at the nozzle (R, summary slide 10; HSG176 para 128, S1): 45,490 kg in the vessel against 1,687 kg in</text><text x="816" y="231.8" font-size="10" font-weight="400" text-anchor="start" fill="#111" >the supply line (27 to 1). It does not stop a hole upstream of XV-102 (sheet 3).</text><text x="806" y="248.1" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Time to empty through a 25 mm hole at the 2.34 kg/s workbook rate is 5.4 h (D, constant rate): isolation cannot help, only PFP, layout and</text><text x="816" y="260.4" font-size="10" font-weight="400" text-anchor="start" fill="#111" >fire-fighting.</text><rect x="20" y="386.00000000000006" width="1560" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="402.00000000000006" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SAFETY INSTRUMENTED FUNCTIONS (SIL = assumed target, label A; no SIL verification is claimed)</text><rect x="20" y="408.00000000000006" width="1560" height="19.6" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >SIF</text><text x="74" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Function</text><text x="204" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Initiator -&gt; final element</text><text x="434" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Assumed SIL / PFD band (A)</text><text x="604" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Demand source and protection layers credited</text><text x="1194" y="421.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Free source / status</text><text x="24" y="441.2000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >SIF-1</text><text x="74" y="441.2000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Overfill protection</text><text x="204" y="441.2000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >LSHH-101 -&gt; XV-101 closes, unloading</text><text x="204" y="453.80000000000007" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >stops</text><text x="434" y="441.2000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A): PFD 0.01 to 0.1</text><text x="604" y="441.2000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Demand: filling error or LT-101 fault (frequency undefined, gap). Layers: LT-101 alarm + operator (generic</text><text x="604" y="453.80000000000007" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >PFD 0.1, sil.GENERIC_IPL_PFD, secondary), 85 % fill limit. Not credited: PSV-101 (vapour valve).</text><text x="1194" y="441.2000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >HSG238 paras 32-34, 50: separate from control (S2); IEC 61511 / API</text><text x="1194" y="453.80000000000007" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >2350 gap</text><rect x="20" y="459.80000000000007" width="1560" height="32.2" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="473.4000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >SIF-2</text><text x="74" y="473.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Gas release isolation</text><text x="204" y="473.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >AT-101A/B/C 2oo3 -&gt; XV-101, 102, 103,</text><text x="204" y="486.00000000000006" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >unloading stop</text><text x="434" y="473.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="604" y="473.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Demand: leak or line break (frequencies on sheet 4). Layers: operator response to low alarm (not credited),</text><text x="604" y="486.00000000000006" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >PFP and layout do not reduce leak frequency.</text><text x="1194" y="473.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >S2, S10 (BP-Husky: credited SIS and relief did not stop overflow);</text><text x="1194" y="486.00000000000006" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >LOPA method C (S19)</text><text x="24" y="505.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >SIF-3</text><text x="74" y="505.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Fire isolation</text><text x="204" y="505.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >BE-101 or HS-101 -&gt; XV-101, 102, 103,</text><text x="204" y="518.2" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >unloading stop</text><text x="434" y="505.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="604" y="505.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Demand: ignited leak or external fire. Layers: PSV-101 (generic PFD 0.01, secondary), jet-rated PFP (no PFD</text><text x="604" y="518.2" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >claimed), FM-101 (pool only, not credited).</text><text x="1194" y="505.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >S5 (PSM operating procedures must cover ESD); gap: IEC 61511</text><rect x="20" y="524.2" width="1560" height="32.2" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="537.8000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >SIF-4</text><text x="74" y="537.8000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >High-pressure</text><text x="74" y="550.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >isolation</text><text x="204" y="537.8000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >PT-101 PAHH -&gt; XV-101 closes, unloading</text><text x="204" y="550.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >stops</text><text x="434" y="537.8000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="604" y="537.8000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Demand: supply pressure above set (source undefined, gap). Layers: PSV-101 (generic PFD 0.01). A trip below</text><text x="604" y="550.4000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >the PSV set keeps the valve shut.</text><text x="1194" y="537.8000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >S2; set point A, API 521 gap</text><rect x="20" y="408.00000000000006" width="1560" height="148.40000000000003" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><polyline points="70,408.00000000000006 70,556.4000000000001" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,408.00000000000006 200,556.4000000000001" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="430,408.00000000000006 430,556.4000000000001" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="600,408.00000000000006 600,556.4000000000001" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1190,408.00000000000006 1190,556.4000000000001" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><text x="22" y="568.4000000000001" font-size="9.6" font-weight="400" text-anchor="start" fill="#666" >SIL bands are the IEC 61508 low-demand bands as held in process_safety.sil (standard text not read). SIL targets here only label the function; they must come from a LOPA or risk graph (CCPS, IEC 61511: not obtained). Partial-stroke</text><text x="22" y="580.2" font-size="9.6" font-weight="400" text-anchor="start" fill="#666" >tests, proof-test interval and architecture limits are not addressed.</text><rect x="20" y="608.4000000000001" width="1560" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="624.4000000000001" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >FIRE PROTECTION, BUND AND SPACING BASIS (free sources only; paywalled standards recorded as gaps)</text><rect x="20" y="630.4000000000001" width="1560" height="19.6" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="644.0000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Topic</text><text x="214" y="644.0000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Basis used on this set</text><text x="684" y="644.0000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Value / derivation</text><text x="1304" y="644.0000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Label and source</text><text x="24" y="663.6000000000001" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Passive fire protection</text><text x="214" y="663.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Jet-rated PFP on shell, supports and vapour space</text><text x="684" y="663.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Rating, thickness and test standard not stated (UL 1709, ISO 22899-1: not obtained)</text><text x="1304" y="663.6000000000001" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >R (summary slide 10); gap</text><rect x="20" y="669.6000000000001" width="1560" height="32.2" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="683.2000000000002" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Fixed water spray / FM-101</text><text x="214" y="683.2000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Pool-fire cooling and neighbouring-equipment cooling only, not jet protection</text><text x="684" y="683.2000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Shell 143 m2 x 4 to 10 L/min/m2 = 571 to 1,428 L/min (34 to 86 m3/h); duration and simultaneous areas not set</text><text x="1304" y="683.2000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >D; density S (summary); NFPA 15/58, OISD-116/117</text><text x="1304" y="695.8000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >gap</text><text x="24" y="715.4000000000002" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Mobile fire-fighting</text><text x="214" y="715.4000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Hose streams and tenders from outside the 35 kW/m2 reach</text><text x="684" y="715.4000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Reach 9.6 m (25 mm jet); BLEVE 35 kW/m2 at about 252 m: no responder should stand inside it</text><text x="1304" y="715.4000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >D (sheets 3, 6); procedure A</text><rect x="20" y="721.4000000000002" width="1560" height="32.2" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="735.0000000000002" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Bund / impoundment</text><text x="214" y="735.0000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Pressurised LPG flashes: rain-out is zero for hot leaks (A6), so a bund captures</text><text x="214" y="747.6000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >little. Grade the ground away from the vessel to a remote impounding area (A).</text><text x="684" y="735.0000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >If the HSG176 rule (110 % of the largest vessel or 25 % of total) were applied: 116 m3 for V-101. HSG176 covers</text><text x="684" y="747.6000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >flammable liquid tanks; applicability to pressurised LPG is not established.</text><text x="1304" y="735.0000000000002" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >A; S1 para 157 for liquids; NFPA 58 / API 2510 gap</text><text x="24" y="767.2000000000003" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Spacing and layout</text><text x="214" y="767.2000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Consequence-based, not table-based: domino escalation, occupied buildings and</text><text x="214" y="779.8000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >ignition sources (HSE COMAH layout, S3)</text><text x="684" y="767.2000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Jet: 9.6 m (35 kW/m2), 19.1 m (1 % lethality). BLEVE: 252 m and about 490 m. HSG176 Table 1 distances (up to 15</text><text x="684" y="779.8000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >m) are for flammable liquid tanks and are not a major-incident distance.</text><text x="1304" y="767.2000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >R (S3, S1); OISD-144/118, NFPA 58, API 2510 gap</text><rect x="20" y="785.8000000000003" width="1560" height="19.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="799.4000000000003" font-size="10.4" font-weight="700" text-anchor="start" fill="#111" >Ventilation and ignition sources</text><text x="214" y="799.4000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >Open-air installation; no enclosure; electrical area classification to be set</text><text x="684" y="799.4000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >API RP 505 and IEC 60079 not obtained</text><text x="1304" y="799.4000000000003" font-size="10.4" font-weight="400" text-anchor="start" fill="#111" >A; gap</text><rect x="20" y="630.4000000000001" width="1560" height="175.00000000000023" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><polyline points="210,630.4000000000001 210,805.4000000000003" fill="none" stroke="#c5c9d4" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="680,630.4000000000001 680,805.4000000000003" fill="none" stroke="#c5c9d4" stroke-width="0.5" st
