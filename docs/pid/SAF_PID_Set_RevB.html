ddle" fill="#111" >403</text><circle cx="230" cy="665" r="15" fill="#fff" stroke="#111" stroke-width="1.6"/><line x1="215" y1="665" x2="245" y2="665" stroke="#111" stroke-width="1.2"/><text x="230" y="663" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >LI</text><text x="230" y="675" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >401</text><circle cx="340" cy="665" r="15" fill="#fff" stroke="#111" stroke-width="1.6"/><line x1="325" y1="665" x2="355" y2="665" stroke="#111" stroke-width="1.2"/><text x="340" y="663" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >LI</text><text x="340" y="675" font-size="9" font-weight="400" text-anchor="middle" fill="#111" >402</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >PROCESS IN BRIEF</text><text x="1141" y="122.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• S: DPR template steps: UCO pretreatment, hydrotreating with H2,</text><text x="1151" y="135.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >isomerisation / cracking, fractionation into SAF, renewable diesel</text><text x="1151" y="148.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >(RD) and naphtha; H2 supply unit (section 4). Feed 30,000 t/yr UCO</text><text x="1151" y="161.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >(S).</text><text x="1141" y="177.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Rev B slate (S, NREL TP-5100-87803 Table G-1, jet mode): SAF 13,388</text><text x="1151" y="191.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >t/yr, RD 8,828, naphtha 2,468, LPG 1,742, fuel gas 436. The DPR's</text><text x="1151" y="204.20000000000002" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >24,000 t/yr SAF is not credible at 30,000 t/yr feed (needs about</text><text x="1151" y="217.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >53,781 t/yr UCO).</text><text x="1141" y="233.60000000000002" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• D: stage 1 (R-201) releases 1,106 kW (1.07 MJ/kg), so liquid recycle</text><text x="1151" y="246.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >is 5.9 kg/kg fresh feed (Rev A 1.5). V-201 vapour carries 9 % of the</text><text x="1151" y="260.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >paraffin; V-202 returns it (stream 25, P-203A/B). Stage 2 (R-301)</text><text x="1151" y="273.20000000000005" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >rises 32 K (D).</text><text x="1141" y="289.40000000000003" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• A: one recycle-gas loop (K-201); H2 3.4 t/d. Hot hydrocarbon plus</text><text x="1151" y="302.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >hydrogen at 50 bar is the dominant hazard: sheets 4 to 8.</text><rect x="1135" y="322.8" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="338.8" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SAFETY DEVICES ON THIS SHEET (details: sheets 6 to 8)</text><text x="1141" y="360.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Relief (A, all to FH-1 &gt; V-501 &gt; FL-501 unless stated): PSV-201 R-201,</text><text x="1151" y="374.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >PSV-202 V-202, PSV-203 gas header / R-301, PSV-204 V-201, PSV-205</text><text x="1151" y="387.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >C-401, PSV-207 V-102 (safe location), PVRV on tanks. V-401, E-202,</text><text x="1151" y="400.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >G-201, V-301 are in a protected zone (sheet 6).</text><text x="1141" y="416.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• ESD-201: XV-201, XV-202, XV-402 close; EDV HV-201 and HV-301 open;</text><text x="1151" y="429.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >K-201, P-201, heaters trip. ESD-401: XV-401, XV-402, XV-403, P-401/402</text><text x="1151" y="443.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >trip. Triggers: TAHH-211/311, FAL-203, PAHH-202, LAHH-202, LALL-201,</text><text x="1151" y="456.20000000000005" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >LALL-301, AT/BE detectors.</text><text x="1141" y="472.40000000000003" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Hydrogen flames are hard to see: gas (AT) detection supplements flame</text><text x="1151" y="485.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >detection (R, EIGA Doc 15/21). Detector type and voting are open</text><text x="1151" y="498.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >items.</text><text x="1141" y="515.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• R (DPR): cost lines 'Hydrogen unit and utilities' INR 120.00 cr and</text><text x="1151" y="528.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >'Effluent, safety &amp; EMP' INR 25.00 cr; contents not described.</text><rect x="1135" y="548.4" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="564.4" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >LEGEND</text><polyline points="1141,586.4 1171,586.4" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1177" y="590.4" font-size="9.5" font-weig " text-anchor="start" fill="#fff" >REACTION HEAT, RECYCLE AND RUNAWAY (D)</text><text x="1141" y="122" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• Rev A derived the 'heat release' from an assumed 45 K rise, giving</text><text x="1151" y="135" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >0.30 MJ/kg. Rev B uses heats of formation (chemicals Hfg, gas, 25 C,</text><text x="1151" y="148" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >frozen in the generator): 1,023 kJ/kg by the fatty-acid route, 1,112</text><text x="1151" y="161" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >by the database triglyceride; mean 1,068 (+/-10 %). Rev A validator</text><text x="1151" y="174" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >range 1.02-1.11 MJ/kg: agrees.</text><text x="1141" y="190" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• Recycle: R = (Q/45 - gas 1.42)/3.23 - 1 = 5.91. NREL text says liquid</text><text x="1151" y="203" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >recycle up to 1:1 plus interbed H2 quench; at R = 1 the unquenched</text><text x="1151" y="216" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >rise would be 135 K. The two are not reconciled: licensor item.</text><text x="1141" y="232" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• Runaway (D, heat per kg over liquid + circulating gas): normal 45 K;</text><text x="1151" y="245" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >quench lost 75 K; recycle pump lost / no diluent 230 K. Rev A showed</text><text x="1151" y="258" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >64 and 113 K (understated 2.3-2.9 x then).</text><text x="1141" y="274" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• R-301: 99 kW, 32 K rise, outlet 332 C (window top 343). No cold-H2</text><text x="1151" y="287" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >quench needed in the base case (0 kg/h); loss of circulation gas would</text><text x="1151" y="300" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >raise the rise to 35 K.</text><text x="1141" y="316" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• Carry-over (PR): the sharp V-201 split of Rev A was wrong; hydrocarbon</text><text x="1151" y="329" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >in the vapour needs a liquid outlet on V-202 (stream 25).</text><text x="1141" y="345" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >• Residuals not closed: stage-2 H2 (NREL 4.5 vs 3.76 wt % total), CO+CO2</text><text x="1151" y="358" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >and water (A pathway shares), licensor selectivity, real-fluid VLE of</text><text x="1151" y="371" font-size="10.2" font-weight="400" text-anchor="start" fill="#111" >water and H2.</text><polyline points="1141,860 1171,860" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1177" y="864" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >process line</text><polyline points="1141,874 1171,874" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="1177" y="878" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD output</text><polyline points="1141,888 1171,888" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="1177" y="892" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >instrument signal</text><polyline points="1141,902 1171,902" fill="none" stroke="#666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 5"/><text x=" stroke-linejoin="round" stroke-linecap="round"/><path d="M936.5,684.7 Q934.2,670.9 942.6,655.1 Q948.1,672.2 943.5,685.3 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.95" transform="rotate(0)"/><text x="950" y="703" font-size="10" font-weight="700" text-anchor="start" fill="#111" ></text><text x="940" y="764" font-size="10" font-weight="700" text-anchor="middle" fill="#111" >FL-501 flare</text><text x="30" y="108" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >UTILITIES (stubs, A): hot oil, cooling water/air, N2, instrument air, power.</text><text x="30" y="122" font-size="9.5" font-weight="700" text-anchor="start" fill="#c62828" >ESD-201 (A): closes XV-201, XV-202, XV-402; opens HV-201, HV-301;</text><text x="30" y="134" font-size="9.5" font-weight="700" text-anchor="start" fill="#c62828" >trips K-201, P-201, heaters. ESD-401: XV-401, 402, 403; trips P-401/402.</text><polygon points="1110.0,235.0 1101.9,237.9 1105.6,245.6 1097.9,241.9 1095.0,250.0 1092.1,241.9 1084.4,245.6 1088.1,237.9 1080.0,235.0 1088.1,232.1 1084.4,224.4 1092.1,228.1 1095.0,220.0 1097.9,228.1 1105.6,224.4 1101.9,232.1" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><text x="1095" y="239" font-size="11" font-weight="700" text-anchor="middle" fill="#c62828" >S1</text><path d="M1081.9,228.3 Q1060.2,210.5 1053.6,174.9 Q1084.8,193.3 1094.1,219.7 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><polygon points="575.0,375.0 566.9,377.9 570.6,385.6 562.9,381.9 560.0,390.0 557.1,381.9 549.4,385.6 553.1,377.9 545.0,375.0 553.1,372.1 549.4,364.4 557.1,368.1 560.0,360.0 562.9,368.1 570.6,364.4 566.9,372.1" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><text x="560" y="379" font-size="11" font-weight="700" text-anchor="middle" fill="#c62828" >S2</text><path d="M574.0,365.3 Q595.8,341.5 635.3,330.8 Q611.8,364.4 582.0,376.7 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><polygon points="577.0,237.0 567.9,240.3 572.0,249.0 563.3,244.9 560.0,254.0 556.7,244.9 548.0,249.0 552.1,240.3 543.0,237.0 552.1,233.7 548.0,225.0 556.7,229.1 560.0,220.0 563.3,229.1 572.0,225.0 567.9,233.7" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><text x="560" y="241" font-size="11" font-weight="700" text-anchor="middle" fill="#c62828" >S3</text><rect x="24" y="128" width="330" height="60.8" rx="0" fill="#fff" stroke="#c62828" stroke-width="1.3"/><text x="30" y="141.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#c62828" >S1  H2 jet fire at the K-201 discharge flange</text><text x="30" y="154.2" font-size="9.5" font-weight="400" text-anchor="start" fill="#c62828" >S2  hot paraffin + H2 release, R-201 effluent line</text><text x="30" y="167.4" font-size="9.5" font-weight="400" text-anchor="start" fill="#c62828" >S3  R-201 runaway, quench lost (+75 K / +230 K, D)</text><text x="30" y="180.6" font-size="9.5" font-weight="400" text-anchor="start" fill="#c62828" >Safeguards (A): table below and sheets 6 to 8</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S1: HYDROGEN RELEASE AND FIRE</text><text x="1141" y="122.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Hydrogen leaks easily, disperses upward and ignites at very low</text><text x="1151" y="135.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >energy; its flame is nearly invisible, so leak (gas or acoustic)</text><text x="1151" y="148.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >detection supplements flame detection (R, EIGA Doc 15/21). Property</text><text x="1151" y="161.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >values are taken from the toolkit property set or a datasheet, not</text><text x="1151" y="174.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >quoted here.</text><text x="1141" y="191.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Likely sources: flanges, seals and instrument connections on the 53</text><text x="1151" y="204.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >bar loop around K-201 and the reactors. The toolkit jet-flame module</text><text x="1151" y="217.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >is built for paraffins, so no hydrogen flame length is given.</text><rect x="1135" y="237.6" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="253.6" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S2: HIGH-PRESSURE RELEASE, AUTO-IGNITION</text><text x="1141" y="275.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Reactor effluent is hot paraffin with excess H2 at 50 bar; above its</text><text x="1151" y="288.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >auto-ignition temperature it can ignite without a spark. The value for</text><text x="1151" y="302.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >this cut is a lab item.</text><text x="1141" y="318.20000000000005" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• High-temperature hydrogen also drives hydrogen attack in steel:</text><text x="1151" y="331.40000000000003" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >material selection is a design item (standard not obtained).</text><rect x="1135" y="351.6" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="367.6" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S3: RUNAWAY / QUENCH FAILURE (D, Rev B)</text><text x="1141" y="389.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Heat of reaction 1,068 kJ/kg UCO from heats of formation (Rev A: 0.30</text><text x="1151" y="402.8" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >MJ/kg implied by the assumed 45 K rise). Recycle ratio 5.9 holds the</text><text x="1151" y="416.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >net rise at 45 K.</text><text x="1141" y="432.20000000000005" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Rise = heat / (cp x liquid + gas) via</text><text x="1151" y="445.40000000000003" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >process_safety.plant_units.adiabatic_rise_K: quench lost 75 K; recycle</text><text x="1151" y="458.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >lost 230 K. Whether this is acceptable depends on the maximum bed</text><text x="1151" y="471.80000000000007" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >temperature (not in the source files).</text><text x="1141" y="488.00000000000006" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Emergency depressuring through HV-201 / HV-301 cools by expansion but</text><text x="1151" y="501.20000000000005" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >does not stop the reaction: stopping feed (XV-201) and H2 (XV-202) is</text><text x="1151" y="514.4000000000001" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >the first action.</text><rect x="1135" y="720" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="736" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >LEGEND</text><polyline points="1141,758 1171,758" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1177" y="762" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >process line</text><polyline points="1141,772 1171,772" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="1177" y="776" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD output</text><polyline points="1141,786 1171,786" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="1177" y="790" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >instrument signal</text><polyline points="1141,800 1171,800" fill="none" stroke="#666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 5"/><text x="1177" y="804" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >flare / relief header</text><text x="1321" y="762" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R = required or named by a free source</text><text x="1321" y="776" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S = sourced   D = derived   A = assumed</text><text x="1321" y="790" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Diamond = stream number (HMB, sheet 2)</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (S1 to S3)</text><rect x="20" y="809" width="1100" height="18" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="174" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="364" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="619" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown</text><text x="874" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >S1 H2 release and fire,</text><text x="24" y="850" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >R-201 / K-201 recycle gas</text><text x="174" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Flange or seal leak on the recycle</text><text x="174" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >gas loop (K-201 discharge, 53 bar,</text><text x="174" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >H2).</text><text x="364" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Hydrogen jet release, ignition gives jet or flash</text><text x="364" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >fire; flame hard to see; escalation to R-201 and</text><text x="364" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >hot lines.</text><text x="619" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >AT-201A/B, AT-301 H2 detectors; BE-201 flame</text><text x="619" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >detector; ESD-201 trips K-201, closes XV-202 and</text><text x="619" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >XV-201, opens EDV HV-201 and HV-301 to FH-1 (all</text><text x="619" y="874" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >A).</text><text x="874" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Hole size distribution; loop inventory; detector</text><text x="874" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >type for H2 flames; not quantified.</text><rect x="20" y="881" width="1100" height="54" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="892" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >S2 High-pressure loss of</text><text x="24" y="904" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >containment, hot</text><text x="24" y="916" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >hydrocarbon and H2</text><text x="174" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Weld or flange failure on the R-201</text><text x="174" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >effluent line (L104, 50 bar, about</text><text x="174" y="916" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >345 C).</text><text x="364" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Hot paraffin plus H2 above its auto-ignition</text><text x="364" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >temperature: ignition on release, jet fire, then</text><text x="364" y="916" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >pool fire; thermal effects on R-201 and supports.</text><text x="619" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >ESD-201 and EDVs; TAHH-211; fire and gas</text><text x="619" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >detection; remote isolation XV-201/XV-202; passive</text><text x="619" y="916" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >fire protection and deluge (A, standard not</text><text x="619" y="928" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >obtained).</text><text x="874" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Auto-ignition temperature of the cut (lab);</text><text x="874" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >valve closing times; line size; not quantified.</text><text x="24" y="946" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >S3 R-201 temperature</text><text x="24" y="958" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >runaway / quench failure</text><text x="174" y="946" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >TIC-212 quench valve fails closed,</text><text x="174" y="958" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >or P-202 trips, or E-203 blocks.</text><text x="364" y="946" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Heat release 1,106 kW (D, Hf) spread over less</text><text x="364" y="958" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >liquid. D: bed rise 45 K normal; 75 K without</text><text x="364" y="970" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >quench; 230 K with no diluent (Rev A: 64 / 113 K).</text><text x="619" y="946" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >TAHH-211 trips ESD-201; TIC-212 / FIC-202;</text><text x="619" y="958" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >PSV-201; EDV HV-201 depressures; XV-201 and XV-202</text><text x="619" y="970" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >close (A).</text><text x="874" y="946" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Maximum bed temperature (catalyst, metallurgy,</text><text x="874" y="958" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >hydrogen attack); licensor heat of reaction;</text><text x="874" y="970" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >temperature rise rate; runaway relief load: not</text><text x="874" y="982" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >quantified.</text><rect x="20" y="809" width="1100" height="180" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

<text x="1151" y="148.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >or pool fire under C-401 and the pumps.</text><text x="1141" y="164.6" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Safeguards drawn are A: the DPR names an 'Effluent, safety &amp; EMP' line</text><text x="1151" y="177.79999999999998" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >(INR 25.00 cr) and a fire NOC (section 6) but no design. Inventory,</text><text x="1151" y="191.0" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >auto-ignition temperature, bund and fire-water basis are open.</text><rect x="1135" y="211.2" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="227.2" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >S5: FLARE RELIEF, LOSS OF COOLING</text><text x="1141" y="249.2" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• E-202 loss (D): stream 12 = H2 247 + steam 409 + CO/CO2/propane 259 +</text><text x="1151" y="262.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >paraffin 2,280 = 3,195 kg/h, upper bound (no hold-up credit).</text><text x="1141" y="278.59999999999997" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• E-401 loss (D): overhead = (1 + 1) x naphtha + light ends = 710 kg/h.</text><text x="1141" y="294.79999999999995" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Screening sizes with process_safety.relief.gas_area (API 520-I gas</text><text x="1151" y="307.99999999999994" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >equation, derived; set 60 / 4 barg, back pressure 350 kPa abs, k and Z</text><text x="1151" y="321.19999999999993" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >are A): PSV-202 106 mm2, API 526 orifice E, 1 valve (critical flow);</text><text x="1151" y="334.4" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >PSV-205 120 mm2, API 526 orifice E, 1 valve (subcritical flow). Flare</text><text x="1151" y="347.59999999999997" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >radiation and KOD size are not quantified.</text><rect x="1135" y="367.79999999999995" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="383.79999999999995" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >COMMON OPEN ITEMS</text><text x="1141" y="405.79999999999995" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• HAZOP / LOPA with licensor data (sheet 8 is a first-pass node list).</text><text x="1141" y="421.99999999999994" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >• Statutory route (DPR section 6): environmental clearance, PESO,</text><text x="1151" y="435.19999999999993" font-size="10.3" font-weight="400" text-anchor="start" fill="#111" >factory and boiler licences, fire NOC. Applicability not assessed.</text><rect x="1135" y="720" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="736" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >LEGEND</text><polyline points="1141,758 1171,758" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1177" y="762" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >process line</text><polyline points="1141,772 1171,772" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="1177" y="776" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD output</text><polyline points="1141,786 1171,786" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="1177" y="790" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >instrument signal</text><polyline points="1141,800 1171,800" fill="none" stroke="#666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 5"/><text x="1177" y="804" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >flare / relief header</text><text x="1321" y="762" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R = required or named by a free source</text><text x="1321" y="776" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >S = sourced   D = derived   A = assumed</text><text x="1321" y="790" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Diamond = stream number (HMB, sheet 2)</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (S4 and S5)</text><rect x="20" y="809" width="1100" height="18" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="174" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="364" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="619" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown</text><text x="874" y="820" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="838" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >S4 Fractionator fire</text><text x="174" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Leak at C-401 bottoms / reboiler</text><text x="174" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >loop (about 303 C RD) or reflux</text><text x="174" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >system ignites.</text><text x="364" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Hot RD above 300 C; pool or spray fire at C-401,</text><text x="364" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >E-402 and P-401.</text><text x="619" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >BE-401 and AT-401; ESD-401 closes XV-401, XV-402,</text><text x="619" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >XV-403, trips pumps; deluge and bund (A); PSV-205</text><text x="619" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >for fire case.</text><text x="874" y="838" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Auto-ignition temperature; inventory; fire water</text><text x="874" y="850" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >demand; bund size; fire-case relief load; not</text><text x="874" y="862" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >quantified.</text><rect x="20" y="869" width="1100" height="42" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="880" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >S5 Flare relief, loss of</text><text x="24" y="892" font-size="9.6" font-weight="700" text-anchor="start" fill="#111" >cooling</text><text x="174" y="880" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Loss of E-202 fans or cooling water:</text><text x="174" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >V-201 vapour is not condensed</text><text x="174" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >(similarly E-401).</text><text x="364" y="880" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Pressure rises in V-202 and the loop until PSV-202</text><text x="364" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >lifts to FH-1. D upper bound: stream 12 = 3,195</text><text x="364" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >kg/h; overhead 710 kg/h (E-401).</text><text x="619" y="880" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >PAHH-202 and ESD-201 stop feed; PSV-202 / PSV-205</text><text x="619" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >to FH-1 and KOD V-501; FL-501; K-201 trip (A).</text><text x="874" y="880" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >Relief load with hold-up credited; flare</text><text x="874" y="892" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >capacity, radiation, KOD size, back pressure;</text><text x="874" y="904" font-size="9.6" font-weight="400" text-anchor="start" fill="#111" >not quantified.</text><rect x="20" y="809" width="1100" height="102" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

 x="914" y="345" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="1024" y="345" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="1134" y="345" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="1244" y="345" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="1354" y="345" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="24" y="367" font-size="11" font-weight="700" text-anchor="start" fill="#111" >Loss of instrument air / power</text><text x="254" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="364" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="474" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="584" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="694" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="804" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="914" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" >X</text><text x="1024" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" ></text><text x="1134" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" ></text><text x="1244" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" ></text><text x="1354" y="367" font-size="11" font-weight="400" text-anchor="start" fill="#111" ></text><rect x="20" y="109" width="1440" height="264" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="22" y="387" font-size="10.5" font-weight="400" text-anchor="start" fill="#666" >Fail positions (A): XV-201, 202, 401, 402, 403 fail closed; HV-201, HV-301 fail open (R: fail-safe ROSOV, HSG176 para 128). LALL-201 also closes LV-201. Tank LAHH: no rundown isolation valves on TK-401/403 lines yet (gap).</text><rect x="20" y="399" width="1560" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="415" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DETECTION, ISOLATION, CONTAINMENT, LAYOUT (R = free named source, A = assumed, gap = standard not obtained)</text><rect x="20" y="424" width="1560" height="19.3" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="435.0" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Topic</text><text x="214" y="435.0" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Basis in this set</text><text x="1154" y="435.0" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Source / status</text><text x="24" y="454.3" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Gas / flame detection</text><text x="214" y="454.3" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >H2 leak detection (AT) at K-201, R-201/E-201, R-301; hydrocarbon AT and flame detectors BE at C-401; flames of H2 are hard to see so gas detection</text><text x="214" y="468.6" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >supplements flame detection. Voting 2oo3 and set points: A.</text><text x="1154" y="454.3" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R (EIGA Doc 15/21; IFC fertilizer EHS for gas detectors); set points</text><text x="1154" y="468.6" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >gap</text><rect x="20" y="476.90000000000003" width="1560" height="33.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="487.90000000000003" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Isolation of large inventories</text><text x="214" y="487.90000000000003" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >Remote shut-off valves close on ESD: XV-201 (feed), XV-202 (H2), XV-401 (RD bottoms), XV-403 (V-301 liquid), XV-402 (hot oil). Fail-safe action and closing</text><text x="214" y="502.20000000000005" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >time to be set by the hazard study. Large hydrocarbon inventories: C-401 sump, V-201, recycle loop.</text><text x="1154" y="487.90000000000003" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R (HSG176 para 128)</text><text x="24" y="521.5" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Bund / impoundment</text><text x="214" y="521.5" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >Tank farm TK-401/402/403 (and TK-101): bund capacity at least 110 % of the largest tank or 25 % of total tank capacity (whichever the source applies); tank</text><text x="214" y="535.8" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >sizes not set, volume not computed.</text><text x="1154" y="521.5" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R (HSG176 para 157); sizes A</text><rect x="20" y="544.1" width="1560" height="33.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="555.1" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Safety distances / layout</text><text x="214" y="555.1" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >H2 equipment: about 5 m to ignition sources and wall openings, 8 m to boundary or wooden structures (EIGA table 1). Small flammable tanks 1 m to 15 m by size</text><text x="214" y="569.4" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >(HSG176 Table 1). Layout must address domino effects and occupied buildings; Indian distances: OISD-STD-106/116/118/144/163 gap.</text><text x="1154" y="555.1" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R (EIGA, HSG176, HSE COMAH layout); OISD gap</text><text x="24" y="588.7" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Fire water / foam / deluge</text><text x="214" y="588.7" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >Deluge on the reactor and C-401 areas and fire water ring main assumed (A). No free source with a design rate was read for this set; OISD fire-water</text><text x="214" y="603.0" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >standards: gap.</text><text x="1154" y="588.7" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >A; gap</text><rect x="20" y="611.3000000000001" width="1560" height="33.6" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="622.3000000000001" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Ventilation / inerting</text><text x="214" y="622.3000000000001" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >Open-air structure for the H2 areas (A); N2 purge and inerting of reactors before start-up and after ESD (A). Vent lines must avoid ignition and detonation</text><text x="214" y="636.6" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >risk (EIGA).</text><text x="1154" y="622.3000000000001" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R for vent lines; A for purge</text><text x="24" y="655.9000000000001" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Hydrogen vent / flare</text><text x="214" y="655.9000000000001" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >All relief to FH-1 &gt; KOD V-501 &gt; FL-501; hydrogen-rich relief needs flame and radiation study; discharge away from workers (CSB Kuraray).</text><text x="1154" y="655.9000000000001" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >R (CSB Kuraray); study open</text><rect x="20" y="664.2" width="1560" height="19.3" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="675.2" font-size="11.2" font-weight="700" text-anchor="start" fill="#111" >Hot oil and hot hydrocarbon</text><text x="214" y="675.2" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >Hot-oil system for E-201, E-402, E-403 (A): leak and fire case; passive fire protection on supports (A).</text><text x="1154" y="675.2" font-size="11.2" font-weight="400" text-anchor="start" fill="#111" >A</text><rect x="20" y="424" width="1560" height="259.5" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>
