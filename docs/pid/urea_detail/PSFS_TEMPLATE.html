 y="405" font-size="10.5" font-weight="700" text-anchor="start" fill="#111" >BLANK FORM  tag ________  name ________________</text><text x="26" y="421" font-size="8.8" font-weight="400" text-anchor="start" fill="#666" >sheet ___  |  copy this box once per unit sheet</text><rect x="21" y="436" width="378" height="14" rx="0" fill="#f2f2f2" stroke="none" stroke-width="1.2"/><text x="26" y="447" font-size="8.8" font-weight="700" text-anchor="start" fill="#1a237e" >A  Final safeguards: relief devices and instrumented protective functions</text><g transform="translate(34,468.5) scale(0.55)" stroke="#111" stroke-width="2.2" fill="#fff"><polygon points="-10,16 10,16 0,-2"/><polygon points="0,-2 18,-10 18,10"/><polyline points="0,-2 0,-8 -6,-12 6,-17 -6,-22 6,-27 0,-31" fill="none"/></g><text x="54" y="463.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >PSV-________  set ___ bar g, capacity: not sized  &gt;  flare / vent / drain</text><text x="54" y="474.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >(choose)</text><g transform="translate(34,497.5) scale(0.55)" stroke="#111" stroke-width="2.2" fill="#fff"><polygon points="-10,16 10,16 0,-2"/><polygon points="0,-2 18,-10 18,10"/><polyline points="0,-2 0,-8 -6,-12 6,-17 -6,-22 6,-27 0,-31" fill="none"/></g><text x="54" y="492.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >PSV-________  set ___ bar g, capacity: not sized  &gt;  flare / vent / drain</text><text x="54" y="503.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >(choose)</text><circle cx="34" cy="522.0" r="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="34" y="521.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >SIS</text><text x="34" y="531.5" font-size="9" font-weight="400" text-anchor="middle" fill="#111" ></text><text x="54" y="524.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >________  ___  HH ___ bar  (________)</text><circle cx="34" cy="546.0" r="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="34" y="545.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >SIS</text><text x="34" y="555.5" font-size="9" font-weight="400" text-anchor="middle" fill="#111" ></text><text x="54" y="548.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >________  ___  HH ___ bar  (________)</text><rect x="21" y="558" width="378" height="14" rx="0" fill="#f2f2f2" stroke="none" stroke-width="1.2"/><text x="26" y="569" font-size="8.8" font-weight="700" text-anchor="start" fill="#1a237e" >B  Capacity-determining components and control valve fail action</text><g transform="translate(34,594.0) rotate(0)" stroke="#111" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><line x1="0" y1="0" x2="0" y2="-15"/><path d="M-9,-15 A9,9 0 0 1 9,-15 Z" fill="#fff"/></g><text x="54" y="592.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >PV-________  control valve, fail __  (________)</text><text x="32" y="617.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#666" >relief-case screen (&gt;25 % of device capacity): not performed</text><rect x="21" y="624" width="378" height="14" rx="0" fill="#f2f2f2" stroke="none" stroke-width="1.2"/><text x="26" y="635" font-size="8.8" font-weight="700" text-anchor="start" fill="#1a237e" >C  Mitigating systems: ESD valves</text><g transform="translate(34,652.0) rotate(0)" stroke="#c62828" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><circle r="3.4" fill="#c62828"/></g><text x="54" y="654.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#111" >XV-________  ____, fail __ (ESD)  (________)</text><rect x="21" y="664" width="378" height="14" rx="0" fill="#f2f2f2" stroke="none" stroke-width="1.2"/><text x="26" y="675" font-size="8.8" font-weight="700" text-anchor="start" fill="#1a237e" >D  Interfaces: discharge destinations</text><text x="32" y="691.5" font-size="8.6" font-weight="400" text-anchor="start" fill="#666" >flare: PSV-________, PSV-________</text><rect x="430" y="96" width="1150" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="438" y="112" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >How to edit a PSFS (public description of the Safeguarding Memorandum, section 8)</text><text x="436" y="138" font-size="9.2" font-weight="700" text-anchor="start" fill="#111" >A  Show every final safeguard of the unit: relief valves, rupture disks, thermal expansion valves (those on pumps and in cooling-water service may be omitted), and every</text><text x="436" y="155" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >    instrumented protective function against loss of containment. Each relief device carries set pressure, capacity and discharge destination. Never summarise as '+ n more'.</text><text x="436" y="172" font-size="9.2" font-weight="700" text-anchor="start" fill="#111" >B  Show every trip, control, bypass valve or restriction that, if inadvertently open, could pass more than 25 % of the relief device capacity, and the relief device capacity itself.</text><text x="436" y="189" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >    For each control valve shown, state spring action (FO / FC), stay-put device and minimum stop if fitted.</text><text x="436" y="206" font-size="9.2" font-weight="700" text-anchor="start" fill="#111" >C  Show the mitigating systems: ESD valves with spring action (FC / FO) and remotely operated valves installed for emergencies.</text><text x="436" y="223" font-size="9.2" font-weight="700" text-anchor="start" fill="#111" >D  Show the interfaces that matter to safeguarding: flare and relief headers, vents, drains, utilities supplied to or from other units.</text><text x="436" y="240" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >Edit the drawing at its source: change the register or the area module, rebuild, then run scripts/psfs_lint.py (--fix redraws the sheets from the registers).</text><rect x="430" y="277" width="1150" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="438" y="293" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >Review checklist (each line is a rule of scripts/psfs_lint.py)</text><text x="436" y="319" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P01-P03  every relief device, ESD valve and trip of the unit is drawn in its box</text><text x="996" y="319" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P05-P06  no tag drawn that is not in the registers; no tag drawn twice</text><text x="436" y="336" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P04  every relief device has a recognised discharge destination</text><text x="996" y="336" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P07, P09  every control valve has a fail action; every ESD valve is FC or FO</text><text x="436" y="353" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P08  no truncation ('+ n more', '...')</text><text x="996" y="353" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P10, P30  relief set and high-high trip not above the equipment design pressure</text><text x="436" y="370" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P11-P13  every unit sheet has a box; text inside boxes; sheet has title and legend</text><text x="996" y="370" font-size="9.2" font-weight="400" text-anchor="start" fill="#111" >P20-P22  open gaps: capacity not sized, set by vendor, &gt;25 % screen not performed</text><rect x="430" y="407" width="1150" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="438" y="423" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >Sign-off</text><text x="436" y="449" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Prepared (process engineer)</text><text x="760" y="449" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >name / date  ______________________</text><text x="436" y="471" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Instrumented functions (control engineer)</text><text x="760" y="471" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >name / date  ______________________</text><text x="436" y="493" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Reviewed (safety / HAZOP leader)</text><text x="760" y="493" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >name / date  ______________________</text><text x="436" y="515" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Revision</text><text x="760" y="515" font-size="9.5" font-weight="400" text-anchor="start" fill="#666" >__  reason: ______________________  ______________________</text><rect x="20" y="960" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="976" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >Legend</text><g transform="translate(40,1008) scale(0.55)" stroke="#111" stroke-width="2.2" fill="#fff"><polygon points="-10,16 10,16 0,-2"/><polygon points="0,-2 18,-10 18,10"/><polyline points="0,-2 0,-8 -6,-12 6,-17 -6,-22 6,-27 0,-31" fill="none"/></g><text x="56" y="1008" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >relief device &gt; set, capacity, destination</text><g transform="translate(330,1002) rotate(0)" stroke="#c62828" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><circle r="3.4" fill="#c62828"/></g><text x="348" y="1006" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD valve (fail action)</text><g transform="translate(520,1002) rotate(0)" stroke="#111" stroke-width="1.8" fill="#fff"><polygon points="-11,-7 11,7 11,-7 -11,7"/><line x1="0" y1="0" x2="0" y2="-15"/><path d="M-9,-15 A9,9 0 0 1 9,-15 Z" fill="#fff"/></g><text x="538" y="1006" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >control valve (fail action)</text><circle cx="720" cy="1002" r="8" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="720" y="1001.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111" >SIS</text><text x="720" y="1011.5" font-size="9" font-weight="400" text-anchor="middle" fill="#111" ></text><text x="736" y="1006" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >instrumented protective function</text><circle cx="940" cy="1002" r="8" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/><text x="940" y="1001.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >AT</text><text x="940" y="1011.5" font-size="9" font-weight="400" text-anchor="middle" fill="#2e7d32" ></text><text x="956" y="1006" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >gas / analyser detector</text><text x="20" y="1034" font-size="8.8" font-weight="400" text-anchor="start" fill="#666" >Derived from RELIEF_SCHEDULE, VALVE_LIST, INSTRUMENT_INDEX and EQUIPMENT_LIST of this build. Gaps: capacity-determining screen (&gt;25 %), non-return valve</text><text x="20" y="1046" font-size="8.8" font-weight="400" text-anchor="start" fill="#666" >identification, unit-to-unit connectivity; the standard that defines the PSFS format is proprietary and was not used. Checked by scripts/psfs_lint.py.</text><rect x="8" y="8" width="1584" height="1114" rx="0" fill="none" stroke="#111" stroke-width="2.2"/><rect x="8" y="8" width="1584" height="66" rx="0" fill="#0d1b3e" stroke="none" stroke-width="1.2"/><text x="24" y="38" font-size="13" font-weight="700" text-anchor="start" fill="#9fb4ff" >VertiStrat Solutions LLP</text><text x="24" y="62" font-size="21" font-weight="700" text-anchor="start" fill="#fff" >Safeguarding  -  PSFS TEMPLATE (blank, with editing rules and review checklist)</text><text x
