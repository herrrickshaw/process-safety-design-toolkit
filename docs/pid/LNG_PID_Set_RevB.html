ext-anchor="start" fill="#111" >SIF-4</text><text x="73.5" y="620.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >LSHH-101 -&gt; close XV-101</text><text x="543.5" y="620.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >liquid carry-over to AGRU, MCHE freeze-out</text><text x="543.5" y="633.4999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >risk</text><text x="803.5" y="620.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >BPCS LIC-101 alarm (A)</text><text x="1133.5" y="620.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1223.5" y="620.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >S2 (BP-Husky S10: SIS credited yet failed, so verify)</text><text x="23.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIF-5</text><text x="73.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >LSLL-401 -&gt; trip K-401/501 and close LV-401</text><text x="543.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >gas blow-by from V-401 to TK-501 (LIC-401</text><text x="543.5" y="664.8999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >failure)</text><text x="803.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >PSV-501A/B, BPCS LIC-401 (A)</text><text x="1133.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1223.5" y="651.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >S2; A</text><rect x="20" y="670.5999999999998" width="1560" height="18.2" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIF-6</text><text x="73.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >PT-301 PAHH -&gt; trip K-301, open BDV-301</text><text x="543.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >blocked MR discharge, surge</text><text x="803.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >PSV-302/305 (A)</text><text x="1133.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1223.5" y="683.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >S5, S11 (discharge location)</text><text x="23.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIF-7</text><text x="73.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >AT-301A/B, AT-201, BE-301 -&gt; ESD-301: close XV-201, XV-701/2, trip K-201/202,</text><text x="73.5" y="714.4999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >K-301, open BDV-301, start DLG-301/2</text><text x="543.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >refrigerant release, ignited leak</text><text x="803.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >gas/flame detection is the layer; deluge and PFP (A)</text><text x="1133.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 2 (A)</text><text x="1223.5" y="701.2999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >S4 leak detection preferred to flame alone; S8; A</text><rect x="20" y="720.1999999999998" width="1560" height="31.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIF-8</text><text x="73.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >AT-501, TSL-501 -&gt; ESD-501: close XV-501/502/503/504, trip P-501</text><text x="543.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >LNG release at transfer line or roof</text><text x="543.5" y="745.8999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >nozzle</text><text x="803.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >impoundment 110 % (R, S9), no drain to water (A)</text><text x="1133.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 2 (A)</text><text x="1223.5" y="732.6999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >S9 impoundment; S1 ROSOV</text><text x="23.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIF-9</text><text x="73.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >AT-401 -&gt; close XV-201, trip K-301, open BDV-301</text><text x="543.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >cold-box (MCHE) leak of MR or LNG</text><text x="803.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >cold-box purge (A, not drawn)</text><text x="1133.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >SIL 1 (A)</text><text x="1223.5" y="764.0999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >A; gap (licensor)</text><rect x="20" y="482.1999999999999" width="1560" height="287.59999999999997" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

</defs><rect width="1600" height="1130" fill="#fff"/><rect x="8" y="8" width="1584" height="1114" rx="0" fill="none" stroke="#111" stroke-width="2.2"/><rect x="8" y="8" width="1584" height="66" rx="0" fill="#0d1b3e" stroke="none" stroke-width="1.2"/><text x="24" y="38" font-size="13" font-weight="700" text-anchor="start" fill="#9fb4ff" >VertiStrat Solutions LLP</text><text x="24" y="62" font-size="21" font-weight="700" text-anchor="start" fill="#fff" >Safety design basis 3 of 3: detection, mitigation, hazard identification, inherent safety</text><text x="1576" y="38" font-size="13" font-weight="400" text-anchor="end" fill="#fff" >Sheet 7 of 7  |  Drawing VS-LNG-007  |  Rev B</text><text x="1576" y="62" font-size="13" font-weight="700" text-anchor="end" fill="#ffcc80" >CONCEPTUAL P&amp;ID - SCREENING BASIS - NOT FOR CONSTRUCTION</text><rect x="1135" y="960" width="445" height="140" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1143" y="981" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Project</text><text x="1205" y="981" font-size="11" font-weight="400" text-anchor="start" fill="#111" >LNG liquefaction plant (repo default 2.0 mtpa case)</text><polyline points="1135,992 1580,992" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1006" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Sheet</text><text x="1205" y="1006" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Detection, mitigation, HAZOP nodes, ISD</text><polyline points="1135,1017 1580,1017" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1031" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Basis</text><text x="1205" y="1031" font-size="11" font-weight="400" text-anchor="start" fill="#111" >lng-design-opensource default case; Rev B 11 Nov 2026</text><polyline points="1135,1042 1580,1042" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1056" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Prepared</text><text x="1205" y="1056" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Claude Sonnet 5.5 for owner review, 11 Nov 2026</text><polyline points="1135,1067 1580,1067" fill="none" stroke="#bbb" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><text x="1143" y="1081" font-size="10.5" font-weight="700" text-anchor="start" fill="#666" >Status</text><text x="1205" y="1081" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Draft B. Screening aid, not certified design</text><rect x="20" y="84" width="1560" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >DETECTION AND MITIGATION (R required by a named free source, A assumed, gap = controlling standard not obtained)</text><rect x="20" y="106" width="1560" height="18.2" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="23.5" y="118.5" font-size="11" font-weight="700" text-anchor="start" fill="#111" >Item</text><text x="253.5" y="118.5" font-size="11" font-weight="700" text-anchor="start" fill="#111" >Basis and status</text><text x="23.5" y="136.7" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Spill containment / impoundment</text><text x="253.5" y="136.7" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Impoundment volume 70,210 m3 = 1.10 x net tank volume 63,827 m3 (single tank, no surge allowance), basis 49 CFR 193.2181 as read in the toolkit docstring (S9, R). Trench and sump from loading line, transfer pumps and</text><text x="253.5" y="149.89999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >process area to the impoundment: layout and slope A. No drain to water or open sea (A). Remote impoundment sump, high-expansion foam: gap (NFPA 11/59A not obtained).</text><rect x="20" y="155.6" width="1560" height="44.599999999999994" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="168.1" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Exclusion zones (Rev A had none)</text><text x="253.5" y="168.1" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Basis stated, distances NOT calculated: 49 CFR 193.2057 requires thermal radiation exclusion zones from a design spill with the GTI LNGFIRE3 model (R); 193.2059 requires vapour dispersion to 2.5 % average concentration,</text><text x="253.5" y="181.29999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >receptor 0.5 m, roughness 0.03 m, stability F, wind 2.01 m/s, humidity 50 % using DEGADIS or an equivalent validated model (R). The toolkit's neutral-gas Gaussian dispersion is not valid for cold LNG vapour (its docstring)</text><text x="253.5" y="194.5" font-size="11" font-weight="400" text-anchor="start" fill="#111" >and is not used. NFPA 59A-2001 sections 2.2.3.2 to 2.2.3.4 (incorporated by the rule): gap. Needs: design spill rate and duration from line sizes, site wind and plot plan.</text><text x="23.5" y="212.7" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Cryogenic embrittlement and RPT</text><text x="253.5" y="212.7" font-size="11" font-weight="400" text-anchor="start" fill="#111" >LNG, cold MR (below -100 C) and ethane at -15 C: carbon steel is not acceptable in cold service; austenitic stainless steel, 9 % Ni steel or aluminium for cold lines, cold box and tank inner (A, qualitative); no drip trays</text><text x="253.5" y="225.89999999999998" font-size="11" font-weight="400" text-anchor="start" fill="#111" >or open drains where LNG could reach water, which is the rapid phase transition condition (A). Material standards (EN 14620, API 620 Annex Q, 49 CFR 193 materials): gap.</text><rect x="20" y="231.6" width="1560" height="31.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="244.1" font-size="11" font-weight="400" text-anchor="start" fill="#111" >BOG, overpressure and vacuum</text><text x="253.5" y="244.1" font-size="11" font-weight="400" text-anchor="start" fill="#111" >TK-501 vapour: BOG 0.158 kg/s at 0.05 %/day; K-501A/B 1 + 1 spare (S[6]); PSV-501A/B with vacuum breaker; PT-501 PAHH/PALL (SIF-1, SIF-3). Pressure-rise upper bound if all BOG is retained 0.59 Pa/s (D9). Ship-loading</text><text x="253.5" y="257.3" font-size="11" font-weight="400" text-anchor="start" fill="#111" >vapour return and rollover loads: not sized. MR suction vacuum of Rev A removed (3.5 bar(a)).</text><text x="23.5" y="275.5" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Fire protection</text><text x="253.5" y="275.5" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Fire water: deluge DLG-301/302 on the train (A); PFP on V-102 and compressor structure supports (A). Fire-water demand not computed: toolkit fire_water.py provides density x area demand but areas and duration are not</text><text x="253.5" y="288.7" font-size="11" font-weight="400" text-anchor="start" fill="#111" >defined (needs layout). HSL fire-pressure-system guidance (S13, R) applies to V-102, V-301 and the bullets: PRV cycling in fire.</text><rect x="20" y="294.4" width="1560" height="31.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="306.9" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Isolation of large inventories</text><text x="253.5" y="306.9" font-size="11" font-weight="400" text-anchor="start" fill="#111" >ROSOV on large inventories (HSG176 para 128, S1, R): XV-501, 502, 503, 504 (tank and jetty), XV-201 (propane receiver outlet), XV-701/702 (bullets), XV-101 (feed). Largest isolatable inventories: TK-501 27,296 t (S),</text><text x="253.5" y="320.09999999999997" font-size="11" font-weight="400" text-anchor="start" fill="#111" >propane in V-102 about 85 t (D), MR charge about 240 t (D, Rev A repo charge).</text><text x="23.5" y="338.29999999999995" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Gas and flame detection logic</text><text x="253.5" y="338.29999999999995" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Gas detectors at release points: compressor hall (AT-201, AT-301A/B), cold box (AT-401), feed/AGRU (AT-101), storage (AT-701), tank area (AT-501) plus TSL-501 cold-spill detector; flame detector BE-301. Leak (gas)</text><text x="253.5" y="351.49999999999994" font-size="11" font-weight="400" text-anchor="start" fill="#111" >detection preferred for hard-to-see flames (EIGA, S4; R for hydrogen, A here); fertilizer guideline asks for detectors in hazard areas (S8, R). Counts, voting and alarm set points: gap.</text><rect x="20" y="357.19999999999993" width="1560" height="31.4" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="23.5" y="369.69999999999993" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Layout and safety distances</text><text x="253.5" y="369.69999999999993" font-size="11" font-weight="400" text-anchor="start" fill="#111" >Layout shall address domino escalation and occupied buildings (HSE COMAH plant layout, S3, R). Control centre sited or protected to stay operational (49 CFR 193, S9, R). Distances: A, not calculated; HSG176 Table 1 spacing</text><text x="253.5" y="382.8999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >is for small flammable liquid tanks and does not apply to LNG (S1).</text><rect x="20" y="106" width="1560" height="282.5999999999999" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><rect x="20" y="396.5999999999999" width="1560" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="412.5999999999999" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >HAZARD IDENTIFICATION (HAZOP-style ont-weight="400" text-anchor="start" fill="#111" >release.</text><text x="26" y="723.0" font-size="11" font-weight="400" text-anchor="start" fill="#111" >• Moderate conditions: MR suction at 3.5 bar(a) (A) removes the vacuum that Rev A had and so the air-ingress route into a flammable mixture inside the loop (qualitative).</text><text x="26" y="748.4" font-size="11" font-weight="400" text-anchor="start" fill="#111" >• Substitute / avoid: no ethylene or heavier refrigerant is used in this layout (repo uses ethane and propane); ethane bullets at -15 C instead of ambient storage lower vapour pressure (S[7]).</text><text x="26" y="773.8" font-size="11" font-weight="400" text-anchor="start" fill="#111" >• Simplify: one cold-box shell and one MR loop for the whole cold end (Rev B) replaces the separate unsized subcooling loop; fewer interconnections.</text><text x="26" y="799.1999999999999" font-size="11" font-weight="400" text-anchor="start" fill="#111" >• Limit consequences: all relief to closed headers (CSB Kuraray, S11), impoundment at the tank, no drains to water (A), full-containment tank class would remove the dyke-surge case (A, standard not obtained: gap).</text></svg></section></body></html>
