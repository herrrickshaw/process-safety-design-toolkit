00" text-anchor="start" fill="#111" >+4.81</text><text x="804" y="207" font-size="10" font-weight="400" text-anchor="start" fill="#111" >slurry</text><text x="974" y="207" font-size="10" font-weight="400" text-anchor="start" fill="#111" >6.98</text><text x="1154" y="207" font-size="10" font-weight="400" text-anchor="start" fill="#111" >9.04</text><text x="1414" y="207" font-size="10" font-weight="400" text-anchor="start" fill="#111" >+2.06</text><rect x="800" y="214" width="780" height="18" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="225" font-size="10" font-weight="400" text-anchor="start" fill="#111" >coke</text><text x="974" y="225" font-size="10" font-weight="400" text-anchor="start" fill="#111" >5.95</text><text x="1154" y="225" font-size="10" font-weight="400" text-anchor="start" fill="#111" >5.98</text><text x="1414" y="225" font-size="10" font-weight="400" text-anchor="start" fill="#111" >+0.03</text><rect x="800" y="106" width="780" height="126" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="804" y="246.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >The balance uses the reference case (docs/VALIDATION.md section 2), which is a calibration to published ranges and was NOT run on this VGO. A repo run</text><text x="804" y="258.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >(CoolProp available in the check environment) with the repo's 90 % S-removal pretreat gives the column at right, 69.9 % conversion and a 757 C</text><text x="804" y="271.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >regenerator, with a warning that dense-bed height is shallow. The two differ by up to 5 points on LPG and 7 points on LCO plus slurry taken together.</text><text x="804" y="283.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >No open INDMAX or plant yield table was found (two searches), so neither set is validated; the real INDMAX is a propylene-maximising mode and is not</text><text x="804" y="296.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >represented by either. Flows 15-19 are therefore indicative.</text><rect x="800" y="318.5" width="780" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="808" y="334.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >F  SLATE FIT: WHAT THE TWO-TARGET REFIT COSTS</text><rect x="800" y="340.5" width="780" height="18" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="804" y="351.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Quantity</text><text x="984" y="351.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Rev A basket</text><text x="1134" y="351.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Rev B basket</text><text x="1384" y="351.5" font-size="10" font-weight="700" text-anchor="start" fill="#111" >Paradip reference</text><text x="804" y="369.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Crude blend (vol%)</text><text x="984" y="369.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >57 UZ / 43 CL</text><text x="1134" y="369.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >34 CL / 36 UZ / 29 Dalia</text><text x="1384" y="369.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >n/a (mix varies by month)</text><rect x="800" y="376.5" width="780" height="18" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="387.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >API / S wt% / TAN</text><text x="984" y="387.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >27.0 / 2.90 / 0.55</text><text x="1134" y="387.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >25.1 / 2.26 / 0.87</text><text x="1384" y="387.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >S 2.10-2.39</text><text x="804" y="405.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Vacuum residue, % of crude</text><text x="984" y="405.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >27.3</text><text x="1134" y="405.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >27.3</text><text x="1384" y="405.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >27.3 (4.1/15); 29.3 nameplate</text><rect x="800" y="412.5" width="780" height="18" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="804" y="423.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >VGO, % of crude</text><text x="984" y="423.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >28.1</text><text x="1134" y="423.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >30.5</text><text x="1384" y="423.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >28.0 (FCC 4.2/15)</text><text x="804" y="441.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >VR CCR (MCR) wt%</text><text x="984" y="441.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >27.3</text><text x="1134" y="441.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >24.9</text><text x="1384" y="441.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >n/d (inferred below 27)</text><rect x="800" y="340.5" width="780" height="108" rx="0" fill="none" stroke="#9aa" stroke-width="1"/><text x="804" y="462.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Two targets (S and VR) with three crudes leaves a one-parameter family; the fit picks the point where both hold. VGO rises to 30.5 % of crude against</text><text x="804" y="475.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >the published 28.0 %, so the FCC feed is now +8 % against the INDMAX figure (Rev A -2 %). TAN rises to 0.87, which raises the naphthenic-acid</text><text x="804" y="487.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >corrosion flag at H-101 and C-101 (scenario 1). Dalia is a plausible Atlantic-basin grade in the repo's assay file; its use is a fitting device, not</text><text x="804" y="500.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >evidence of Paradip's purchases.</text><rect x="800" y="522.5" width="780" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="808" y="538.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >G  NOT CLOSED, AND WHY</text><text x="806" y="558.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• NHT feed 59 % to 68 % below nameplate: no source explains the nameplate; end-point sweep (C) reaches about half (unchanged).</text><text x="806" y="579.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• FCC yields: no open table; reference case kept, repo run shown (E). The 757 C regenerator is a repo screen, below its 760 C flag; Rev A basket gave</text><text x="816" y="591.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >772 C.</text><text x="806" y="612.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Crude heater duty: no plant value; PR check 6 to 15 % below the repo number (D). Unchanged.</text><text x="806" y="632.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hydrotreater H2 below the 150-300 scf/bbl band: floor kept, range shown (B). Sulphur routing from coker and FCC to the SRU: not modelled, so the SRU</text><text x="816" y="645.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >load (696 t/d real) is not reproduced.</text><text x="806" y="665.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Coker CCR: the real value is likely lower than 24.9 wt% (ratio 26.6 % of feed); not testable without the assay of the actual coker feed.</text></svg></section><section class="sheet" id="s4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>

or="middle" fill="#fff" >2</text><polygon points="881.0,240.0 873.5,242.7 876.9,249.9 869.7,246.5 867.0,254.0 864.3,246.5 857.1,249.9 860.5,242.7 853.0,240.0 860.5,237.3 857.1,230.1 864.3,233.5 867.0,226.0 869.7,233.5 876.9,230.1 873.5,237.3" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><circle cx="948" cy="165" r="13" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text x="948" y="169" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >3</text><polyline points="882,262 853,262" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><path d="M904.5,175.0 Q897.0,156.1 912.0,133.0 Q927.0,156.1 919.5,175.0 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.9" transform="rotate(0)"/><polygon points="924.0,235.0 917.5,237.3 920.5,243.5 914.3,240.5 912.0,247.0 909.7,240.5 903.5,243.5 906.5,237.3 900.0,235.0 906.5,232.7 903.5,226.5 909.7,229.5 912.0,223.0 914.3,229.5 920.5,226.5 917.5,232.7" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >1  CRUDE HEATER H-101: TUBE RUPTURE</text><text x="1141" y="120.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Release: hot crude at the 360 C coil outlet (S: distill()) from a</text><text x="1151" y="132.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >failed coil pass, inside the firebox. Charge through the heater is</text><text x="1151" y="145.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >1,712,329 kg/h = 476 kg/s (D), an upper bound; per-pass flow and hole</text><text x="1151" y="157.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >size are n/d.</text><text x="1141" y="173.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hazard: firebox fire and fireball, pool fire under the heater, flame</text><text x="1151" y="185.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >on C-101 and the transfer line. Naphthenic-acid and sulphidation</text><text x="1151" y="198.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >corrosion above about 232 C is flagged for this basket (Rev B TAN</text><text x="1151" y="210.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >0.87, 2.26 wt% S; Rev A was 0.55 and 2.9; docs/SAFETY.md, S).</text><text x="1141" y="226.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: needs coil inventory, rupture size, pass flow, tube</text><text x="1151" y="238.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >metallurgy, time to isolate.</text><rect x="1135" y="258.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="274.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >2  H2 / H2S RELEASE AT VGO HYDROTREATER</text><text x="1141" y="294.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Release: recycle-gas or effluent leak at R-204 / D-204. Loop duty (S,</text><text x="1151" y="306.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hydrotreat()): H2S 12,038 kg/h generated, H2 make-up 2,848 kg/h,</text><text x="1151" y="319.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >recycle gas 275,840 Nm3/h. Operating P and T are n/d.</text><text x="1141" y="334.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hazard: toxic H2S cloud (green), H2 jet fire that is hard to see,</text><text x="1151" y="347.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >flash fire or explosion in congested structure; high-temperature</text><text x="1151" y="359.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hydrogen and sulphide attack; temperature excursion if quench is lost.</text><text x="1141" y="375.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: needs operating P and T, hole size, loop inventory,</text><text x="1151" y="387.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >H2S fraction in recycle gas, wind and layout.</text><rect x="1135" y="407.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="423.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >3  FCC UPSET: SLIDE VALVE / AFTERBURN</text><text x="1141" y="443.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Initiator: slide-valve erosion or loss of catalyst circulation lets</text><text x="1151" y="455.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hydrocarbon back-flow into the air-side regenerator, or air into the</text><text x="1151" y="468.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >reactor; afterburn lifts regenerator gas temperature. Repo screen: the</text><text x="1151" y="480.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Rev B basket's pretreated VGO gives a 757 C regenerator, below the</text><text x="1151" y="493.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >repo's 760 C action flag; the Rev A basket gave 772 C, above it</text><text x="1151" y="505.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >(docs/VALIDATION.md, S). A screen, not a prediction.</text><text x="1141" y="521.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hazard: explosion or fire in R-302 / flue gas / C-301, internals</text><text x="1151" y="533.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >damage, loss of containment of hot catalyst and hydrocarbon.</text><text x="1141" y="549.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: needs vessel volumes and catalyst inventory;</text><text x="1151" y="561.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >fcc_operate output is not a sizing basis.</text><rect x="1135" y="583.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="599.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >KEY TO THE OVERLAYS</text><text x="1141" y="619.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Yellow star = release point. Flames = fire. Green ellipse = toxic /</text><text x="1151" y="631.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >flammable cloud. Red numbered circle = scenario. Red valves and dashed</text><text x="1151" y="644.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >red lines = ESD outputs; blue circles and bubbles = detectors and</text><text x="1151" y="656.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >transmitters (all drawn on sheet 1 and listed in the sheet 7 matrix).</text><text x="1151" y="669.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >Tags A unless marked R.</text><rect x="1135" y="690.5" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="706.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >CONSEQUENCE BASIS</text><text x="1141" y="726.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• No distances, rates, radiation or toxic doses are given: inventories,</text><text x="1151" y="739.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >hole sizes, operating P and T are not defined by the repo.</text><text x="1151" y="751.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >process_safety consequence modules were not run.</text><text x="1141" y="767.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Standards named are pointers from the repo's OISD map (titles and</text><text x="1151" y="779.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >editions only; texts not read, INR 10,500 each): OISD-STD-111, 133,</text><text x="1151" y="792.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >106, 112, 152, 241, 116, 118.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative; consequences not quantified)</text><rect x="20" y="806" width="1100" height="17.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="144" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="334" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="534" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (R / A)</text><text x="874" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="834.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >1  H-101 tube rupture</text><text x="144" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Coil failure by coking hot spot,</text><text x="144" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >flame impingement, corrosion, or</text><text x="144" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >loss of pass flow</text><text x="334" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Hot hydrocarbon into firebox:</text><text x="334" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >fireball, pool fire, flame on C-101</text><text x="534" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >FSLL-101, BE-101, AT-101A to ESD-1 (A); XV-101 fuel shut-off;</text><text x="534" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-102 feed and XV-103 outlet isolation (A); fire water (OISD-</text><text x="534" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >STD-116 gap)</text><text x="874" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Coil inventory, pass layout, tube material and</text><text x="874" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >skin T limit, time to isolate, distance, fire-</text><text x="874" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >water capacity</text><rect x="20" y="864.0" width="1100" height="40.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="875.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >2  H2/H2S release</text><text x="24" y="886.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >R-204</text><text x="144" y="875.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Flange, seal or line failure on</text><text x="144" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >recycle gas or effluent</text><text x="334" y="875.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Toxic H2S, H2 jet fire or flash fire,</text><text x="334" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >explosion in congested area</text><text x="534" y="875.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >AT-204A/B (A, leak detection preferred for H2: R EIGA 15/21);</text><text x="534" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >ESD-2 on TAHH-204; XV-205 H2 and XV-206 feed isolation; HV-204,</text><text x="534" y="898.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PSV-204 to flare (A)</text><text x="874" y="875.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Operating P and T, loop inventory, H2S fraction,</text><text x="874" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >hole sizes, toxic criteria, wind and layout</text><text x="24" y="915.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >3  FCC upset</text><text x="144" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Slide valve erosion or jam; loss of</text><text x="144" y="927.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >circulation or air blower trip;</text><text x="144" y="938.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >afterburn</text><text x="334" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Air-hydrocarbon mixture, explosion in</text><text x="334" y="927.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >R-302 / C-301, hot-catalyst loss of</text><text x="334" y="938.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >containment</text><text x="534" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PDIC-301 and separate PDALL-301 (A); TAHH-302; SV-301/302, XV-301</text><text x="534" y="927.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >air and XV-302 feed isolation via ESD-3 (A; FCC SIS R: SAFETY.md)</text><text x="874" y="915.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Licensor SIS logic, vessel volumes, catalyst</text><text x="874" y="927.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >inventory</text><rect x="20" y="806" width="1100" height="139. font-weight="700" text-anchor="middle" fill="#fff" >4</text><rect x="22" y="124" width="86" height="112" rx="0" fill="none" stroke="#6d4c41" stroke-width="1.6" stroke-dasharray="8 4"/><path d="M37.6,140.8 Q31.1,130.0 37.5,114.4 Q48.8,126.9 46.4,139.2 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.95" transform="rotate(0)"/><polygon points="50.0,142.0 45.7,143.5 47.7,147.7 43.5,145.7 42.0,150.0 40.5,145.7 36.3,147.7 38.3,143.5 34.0,142.0 38.3,140.5 36.3,136.3 40.5,138.3 42.0,134.0 43.5,138.3 47.7,136.3 45.7,140.5" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><circle cx="166" cy="120" r="13" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text x="166" y="124" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >5</text><text x="26" y="247" font-size="9.5" font-weight="700" text-anchor="start" fill="#6d4c41" >bund (A)</text><rect x="790" y="696" width="100" height="72" rx="0" fill="none" stroke="#6d4c41" stroke-width="1.6" stroke-dasharray="8 4"/><path d="M800.8,703.9 Q789.5,688.8 792.3,664.4 Q810.2,681.3 811.2,700.1 Z" fill="url(#flame)" stroke="#c62828" stroke-width="1.2" opacity="0.95" transform="rotate(0)"/><polygon points="814.0,704.0 809.7,705.5 811.7,709.7 807.5,707.7 806.0,712.0 804.5,707.7 800.3,709.7 802.3,705.5 798.0,704.0 802.3,702.5 800.3,698.3 804.5,700.3 806.0,696.0 807.5,700.3 811.7,698.3 809.7,702.5" fill="#ffeb3b" stroke="#c62828" stroke-width="2"/><circle cx="792" cy="684" r="13" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text x="792" y="688" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >5</text><text x="794" y="764" font-size="8.5" font-weight="700" text-anchor="start" fill="#6d4c41" >bund (A)</text><polygon points="61,275 79,275 70,261" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/><polygon points="896,700 914,700 905,686" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/><text x="84" y="289" font-size="9" font-weight="700" text-anchor="middle" fill="#1565c0" >foam monitor (A)</text><text x="905" y="712" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1565c0" >foam (A)</text><rect x="1135" y="84" width="445" height="866" rx="0" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="1135" y="84" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="100" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >4  LOSS OF COOLING WATER OR POWER: RELIEF TO FLARE</text><text x="1141" y="120.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Initiator: total cooling-water failure (E-103 and all condensers) or</text><text x="1151" y="132.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >plant power failure (K-201, K-301, pumps stop). Columns lose</text><text x="1151" y="145.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >condensing; reactors and furnaces keep releasing heat; the 14 drawn</text><text x="1151" y="157.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >PSVs (green) lift to the flare header (red), X marks = utility lost.</text><text x="1141" y="173.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hazard: simultaneous relief exceeds header or KO capacity; liquid</text><text x="1151" y="185.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >carry-over from D-901 gives burning rain; flare radiation at grade;</text><text x="1151" y="198.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >back pressure on relief valves; H2S in the relieved gas burns to SO2;</text><text x="1151" y="210.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >furnaces and hot reactors need an orderly shutdown (fuel trips XV-101,</text><text x="1151" y="223.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >XV-404; HV-204; FCC feed XV-302).</text><text x="1141" y="238.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: relief loads per unit are not computed by the repo;</text><text x="1151" y="251.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >the schedule (sheet 6) lists what each device needs. OISD-STD-106</text><text x="1151" y="263.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >pointer: not read.</text><rect x="1135" y="283.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="299.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >5  FLOATING-ROOF TANK FIRE (T-001 CRUDE, T-801 GASOLINE)</text><text x="1141" y="319.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Initiator: lightning or static ignition of vapour at the rim seal;</text><text x="1151" y="331.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >roof sinking or tilt widens the fire to a full-surface fire. Crude</text><text x="1151" y="344.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >fires can also develop boilover (qualitative; not verified against a</text><text x="1151" y="356.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >source here).</text><text x="1141" y="372.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Hazard: radiation on neighbouring tanks and the unit, escalation,</text><text x="1151" y="384.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >large smoke plume with SO2 from a 2.26 wt% S crude, firefighting run-</text><text x="1151" y="397.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >off.</text><text x="1141" y="412.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Not quantified: tank diameters, levels and spacing are n/d. Bund rule</text><text x="1151" y="425.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >(R, HSG176 para 157 as recorded in the checklist) is on sheet 8. OISD-</text><text x="1151" y="437.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >STD-108/129/116/118: titles only, not read.</text><rect x="1135" y="459.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="475.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >KEY TO THE OVERLAYS</text><text x="1141" y="495.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Red thick line = relief / flare header carrying the release; green</text><text x="1151" y="507.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >glyphs = relief valves lifting; red X = utility lost. Flames on T-001</text><text x="1151" y="520.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >and T-801 = rim-seal fire; dashed brown box = bund; blue triangle =</text><text x="1151" y="532.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >foam monitor. Tags A.</text><rect x="1135" y="554.0" width="445" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="1143" y="570.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >CONSEQUENCE BASIS</text><text x="1141" y="590.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• No relief loads, radiation distances or fire-water demands are given.</text><text x="1151" y="602.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >The process_safety flare module (API 521 point-source method) needs a</text><text x="1151" y="615.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >relief rate and geometry this drawing does not have.</text><text x="1141" y="630.5" font-size="10" font-weight="400" text-anchor="start" fill="#111" >• Tank 'boilover' wording is general literature behaviour, not verified</text><text x="1151" y="643.0" font-size="10" font-weight="400" text-anchor="start" fill="#111" >against a source here.</text><rect x="20" y="784" width="1100" height="22" rx="0" fill="#1a237e" stroke="none" stroke-width="1.2"/><text x="28" y="800" font-size="12.5" font-weight="700" text-anchor="start" fill="#fff" >SCENARIO TABLE (qualitative; consequences not quantified)</text><rect x="20" y="806" width="1100" height="17.5" rx="0" fill="#e8eaf0" stroke="none" stroke-width="1.2"/><text x="24" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Scenario</text><text x="164" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Initiating event</text><text x="364" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Hazard</text><text x="584" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Safeguards shown (R / A)</text><text x="914" y="817.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >Open data needs</text><text x="24" y="834.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >4  Loss of cooling or</text><text x="24" y="846.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >power</text><text x="164" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Total cooling-water failure or</text><text x="164" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >electrical bus loss</text><text x="364" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Relief overload of flare header and KO,</text><text x="364" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >liquid carry-over, radiation, back</text><text x="364" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pressure, SO2</text><text x="584" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >PSV-101..PSV-901 (14 drawn) to common header (A); D-901 KO with</text><text x="584" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >LAHH-901 (A); FL-901 with pilot (A); HV-204 (A); fuel-gas trips</text><text x="584" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >via ESD-1, 2, 3, 4 (A); emergency power for instruments (A)</text><text x="914" y="834.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Relief load per unit and simultaneous</text><text x="914" y="846.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >case, header and KO sizing, CW and power</text><text x="914" y="857.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >reliability, flare radiation limits</text><text x="914" y="869.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >(OISD-STD-106/109 not read)</text><rect x="20" y="875.5" width="1100" height="40.5" rx="0" fill="#f6f7fa" stroke="none" stroke-width="1.2"/><text x="24" y="886.5" font-size="9.5" font-weight="700" text-anchor="start" fill="#111" >5  Tank fire T-001 / T-801</text><text x="164" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Lightning, static or hot-work ignition</text><text x="164" y="898.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >at rim seal; sunk roof</text><text x="364" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Rim-seal fire to full-surface fire,</text><text x="364" y="898.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >radiation to neighbours, boilover (crude),</text><text x="364" y="909.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >smoke</text><text x="584" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Bund (A, rule R); LHD-001 and LHD-801 (A); foam monitors and</text><text x="584" y="898.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >rim-seal foam (A); cooling water to neighbouring shell (A);</text><text x="584" y="909.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >XV-001 tank-outlet isolation (A)</text><text x="914" y="886.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >Tank diameter, level, spacing, foam and</text><text x="914" y="898.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >water demand, fire-water supply, vapour</text><text x="914" y="909.5" font-size="9.5" font-weight="400" text-anchor="start" fill="#111" >pressure, wind</text><rect x="20" y="806" width="1100" height="110.0" rx="0" fill="none" stroke="#9aa" stroke-width="1"/></svg></section><section class="sheet" id="s6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="420mm" height="297mm" font-family="Helvetica, Arial, sans-serif"><defs>
